<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12n0name AI</title>

<!-- FAVICON -->

<link rel="icon" type="image/png" href="logo.png">
<link rel="shortcut icon" type="image/png" href="logo.png">

<style>
:root {
    --bg:#0b0d10;
    --sidebar:#111318;
    --surface:#171a20;
    --hover:#22262e;
    --border:#292d35;
    --text:#fff;
    --secondary:#969ca8;
    --muted:#646a75;
    --user:#252a33;
    --cyan:#00e5ff;
    --purple:#7c4dff;
}

body.light {
    --bg:#ffffff;
    --sidebar:#f5f6f8;
    --surface:#ffffff;
    --hover:#e9ebef;
    --border:#dfe2e7;
    --text:#111318;
    --secondary:#5f6673;
    --muted:#8a909b;
    --user:#eef0f4;
}

* {
    box-sizing:border-box;
}

html, body {
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial, Helvetica, sans-serif;
    background:var(--bg);
    color:var(--text);
}

body {
    overflow:hidden;
}

/* SIDEBAR */

.sidebar {
    position:fixed;
    top:0;
    left:0;
    width:270px;
    height:100%;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    z-index:10;
    display:none;
    padding:18px;
}

.sidebar.open {
    display:block;
}

.sidebar-top {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
}

.logo {
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-box {
    width:38px;
    height:38px;
    border-radius:11px;
    background:#0c1016;
    border:1px solid #24313a;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    box-shadow:
        0 0 12px rgba(0,229,255,.25),
        0 0 18px rgba(124,77,255,.15);
}

.logo-box::after {
    content:"";
    position:absolute;
    left:0;
    right:0;
    height:2px;
    background:var(--cyan);
    box-shadow:0 0 8px var(--cyan);
    animation:scan 2s linear infinite;
}

.logo-number {
    font-size:18px;
    font-weight:bold;
    background:linear-gradient(90deg,var(--cyan),var(--purple));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.logo-text {
    font-size:17px;
    font-weight:bold;
}

@keyframes scan {
    0% {
        top:-4px;
    }

    100% {
        top:42px;
    }
}

.close-sidebar {
    border:0;
    background:none;
    color:var(--secondary);
    font-size:22px;
    cursor:pointer;
}

.close-sidebar:hover {
    color:var(--text);
}

.new-chat {
    width:100%;
    padding:12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface);
    color:var(--text);
    cursor:pointer;
    text-align:left;
    font-size:14px;
}

.new-chat:hover {
    background:var(--hover);
}

/* MAIN */

.main {
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

/* TOPBAR */

.topbar {
    height:62px;
    min-height:62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid var(--border);
    background:var(--bg);
}

.top-left {
    display:flex;
    align-items:center;
    gap:14px;
}

.menu {
    border:0;
    background:none;
    color:var(--text);
    font-size:24px;
    cursor:pointer;
}

.title {
    font-size:17px;
    font-weight:bold;
}

.theme {
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    width:40px;
    height:40px;
    border-radius:10px;
    cursor:pointer;
    font-size:17px;
}

.theme:hover {
    background:var(--hover);
}

/* CHAT */

.chat {
    flex:1;
    overflow-y:auto;
    padding:30px 18px 150px;
}

.welcome {
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding-bottom:80px;
}

.welcome h1 {
    margin:0 0 10px;
    font-size:32px;
}

.welcome p {
    margin:0;
    color:var(--secondary);
    font-size:15px;
}

/* MESSAGES */

.messages {
    width:100%;
    max-width:850px;
    margin:auto;
}

.message {
    display:flex;
    margin:20px 0;
}

.message.user {
    justify-content:flex-end;
}

.message.ai {
    justify-content:flex-start;
}

.bubble {
    max-width:75%;
    padding:13px 16px;
    border-radius:16px;
    line-height:1.55;
    font-size:15px;
    word-wrap:break-word;
    overflow-wrap:anywhere;
    white-space:normal;
}

.user .bubble {
    background:var(--user);
    border:1px solid var(--border);
}

.ai .bubble {
    background:transparent;
    border:0;
    padding-left:0;
}

.ai-content {
    display:flex;
    gap:12px;
    align-items:flex-start;
    max-width:100%;
}

.ai-avatar {
    flex-shrink:0;
    width:32px;
    height:32px;
    border-radius:9px;
    background:#0c1016;
    border:1px solid #24313a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
    color:var(--cyan);
    box-shadow:0 0 10px rgba(0,229,255,.12);
}

/* CODE */

.bubble pre {
    margin:10px 0;
    padding:12px;
    border-radius:10px;
    background:#0c1016;
    border:1px solid var(--border);
    overflow-x:auto;
    white-space:pre-wrap;
    word-break:break-word;
    font-family:Consolas, "Courier New", monospace;
    font-size:13px;
}

.bubble code {
    font-family:Consolas, "Courier New", monospace;
}

/* INPUT */

.input-area {
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    padding:16px 18px 18px;
    background:linear-gradient(
        to top,
        var(--bg) 75%,
        transparent
    );
}

.input-wrap {
    max-width:850px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:10px;
}

textarea {
    flex:1;
    resize:none;
    min-height:42px;
    max-height:160px;
    border:0;
    outline:0;
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    padding:10px;
}

textarea::placeholder {
    color:var(--muted);
}

.send {
    width:42px;
    height:42px;
    border:0;
    border-radius:11px;
    background:var(--text);
    color:var(--bg);
    cursor:pointer;
    font-size:17px;
    flex-shrink:0;
}

.send:hover {
    opacity:.85;
}

.send.stop {
    background:#ff3b30;
    color:white;
}

/* FOOTER */

.footer {
    text-align:center;
    color:var(--muted);
    font-size:11px;
    margin-top:8px;
}

/* MOBILE */

@media (max-width:700px) {

    .sidebar {
        width:270px;
    }

    .welcome h1 {
        font-size:26px;
    }

    .bubble {
        max-width:85%;
    }

    .chat {
        padding-left:12px;
        padding-right:12px;
    }

    .input-area {
        padding-left:10px;
        padding-right:10px;
    }
}
</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">

```
<div class="sidebar-top">

    <div class="logo">

        <div class="logo-box">
            <div class="logo-number">12</div>
        </div>

        <div class="logo-text">
            12n0name
        </div>

    </div>

    <button
        class="close-sidebar"
        onclick="toggleSidebar()"
    >
        ×
    </button>

</div>

<button
    class="new-chat"
    onclick="newChat()"
>

</button>
```

</div>

<!-- MAIN -->

<div class="main">

```
<!-- TOPBAR -->

<div class="topbar">

    <div class="top-left">

        <button
            class="menu"
            onclick="toggleSidebar()"
        >
            ☰
        </button>

        <div class="title">
            12n0name AI
        </div>

    </div>

    <button
        class="theme"
        onclick="toggleTheme()"
        id="themeButton"
    >
        🌙
    </button>

</div>


<!-- CHAT -->

<div
    class="chat"
    id="chat"
>

    <div
        class="welcome"
        id="welcome"
    >

        <h1>
            What can I help with?
        </h1>

        <p>
            Ask anything. Build anything. Explore anything.
        </p>

    </div>

    <div
        class="messages"
        id="messages"
    ></div>

</div>


<!-- INPUT -->

<div class="input-area">

    <div class="input-wrap">

        <textarea
            id="input"
            placeholder="Ask 12n0name..."
            rows="1"
        ></textarea>

        <button
            class="send"
            id="sendButton"
            onclick="sendMessage()"
        >
            ↑
        </button>

    </div>

    <div class="footer">
        12n0name AI can make mistakes. Check important information.
    </div>

</div>
```

</div>

<script>

/* =====================================================
   LLAMA.CPP API
   ===================================================== */

/* IMPORTANT:
   The /v1/chat/completions part is required.
*/

const API_URL =
    "https://consist-significantly-definitions-counts.trycloudflare.com";


let conversation = [];

let controller = null;

let generating = false;


/* =====================================================
   SIDEBAR
   ===================================================== */

function toggleSidebar() {

    const sidebar =
        document.getElementById("sidebar");

    sidebar.classList.toggle("open");
}


/* =====================================================
   THEME
   ===================================================== */

function toggleTheme() {

    document.body.classList.toggle("light");

    const light =
        document.body.classList.contains("light");

    localStorage.setItem(
        "12n0name-theme",
        light ? "light" : "dark"
    );

    document.getElementById(
        "themeButton"
    ).textContent =
        light ? "☀️" : "🌙";
}


if (
    localStorage.getItem("12n0name-theme")
    === "light"
) {

    document.body.classList.add("light");

    document.getElementById(
        "themeButton"
    ).textContent = "☀️";
}


/* =====================================================
   TEXTAREA
   ===================================================== */

const input =
    document.getElementById("input");


input.addEventListener(
    "input",
    function() {

        this.style.height = "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                160
            ) + "px";
    }
);


input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =====================================================
   SAFE TEXT
   ===================================================== */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   RESPONSE TEXT HANDLER
   ===================================================== */

function getTextContent(content) {

    if (
        typeof content === "string"
    ) {
        return content;
    }

    if (
        Array.isArray(content)
    ) {

        return content
            .map(function(item) {

                if (
                    typeof item === "string"
                ) {
                    return item;
                }

                if (
                    item &&
                    typeof item.text === "string"
                ) {
                    return item.text;
                }

                if (
                    item &&
                    typeof item.content === "string"
                ) {
                    return item.content;
                }

                return "";
            })
            .join("");
    }

    if (
        content &&
        typeof content.text === "string"
    ) {
        return content.text;
    }

    if (
        content &&
        typeof content.content === "string"
    ) {
        return content.content;
    }

    return String(
        content ?? ""
    );
}


/* =====================================================
   FORMAT TEXT
   ===================================================== */

function formatText(text) {

    return escapeHTML(
        getTextContent(text)
    )
    .replace(/\r\n/g, "\n")
    .replace(/\r/g, "\n")
    .replace(/\n/g, "<br>");
}


/* =====================================================
   ADD USER MESSAGE
   ===================================================== */

function addUserMessage(text) {

    document.getElementById(
        "welcome"
    ).style.display = "none";


    const message =
        document.createElement("div");

    message.className =
        "message user";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    bubble.innerHTML =
        formatText(text);


    message.appendChild(bubble);


    document.getElementById(
        "messages"
    ).appendChild(message);


    scrollToBottom();
}


/* =====================================================
   ADD AI MESSAGE
   ===================================================== */

function addAIMessage(text) {

    const message =
        document.createElement("div");

    message.className =
        "message ai";


    const content =
        document.createElement("div");

    content.className =
        "ai-content";


    const avatar =
        document.createElement("div");

    avatar.className =
        "ai-avatar";

    avatar.textContent =
        "12";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    bubble.innerHTML =
        formatText(text);


    content.appendChild(avatar);

    content.appendChild(bubble);

    message.appendChild(content);


    document.getElementById(
        "messages"
    ).appendChild(message);


    scrollToBottom();
}


/* =====================================================
   THINKING MESSAGE
   ===================================================== */

function createThinkingMessage() {

    const message =
        document.createElement("div");

    message.className =
        "message ai";

    message.id =
        "thinking";


    const content =
        document.createElement("div");

    content.className =
        "ai-content";


    const avatar =
        document.createElement("div");

    avatar.className =
        "ai-avatar";

    avatar.textContent =
        "12";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        "Thinking...";


    content.appendChild(avatar);

    content.appendChild(bubble);

    message.appendChild(content);


    document.getElementById(
        "messages"
    ).appendChild(message);


    scrollToBottom();
}


/* =====================================================
   SEND MESSAGE
   ===================================================== */

async function sendMessage() {

    if (generating) {

        stopGeneration();

        return;
    }


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    addUserMessage(text);


    conversation.push({

        role:"user",

        content:text

    });


    input.value = "";

    input.style.height =
        "42px";


    createThinkingMessage();


    generating = true;

    controller =
        new AbortController();


    const sendButton =
        document.getElementById(
            "sendButton"
        );


    sendButton.classList.add(
        "stop"
    );

    sendButton.textContent =
        "■";


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:JSON.stringify({

                        /*
                         * llama.cpp accepts
                         * OpenAI-compatible requests.
                         */

                        model:
                            "qwen2.5-vl-3b-instruct-q4_k_m.gguf",

                        messages:
                            conversation,

                        temperature:
                            0.7,

                        max_tokens:
                            1024,

                        stream:false

                    }),

                    signal:
                        controller.signal

                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                "Server response:",
                errorText
            );

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        console.log(
            "llama.cpp response:",
            data
        );


        const rawAnswer =
            data?.choices?.[0]?.message?.content;


        const answer =
            getTextContent(
                rawAnswer
            ).trim();


        if (!answer) {

            throw new Error(
                "Empty response from model"
            );
        }


        const thinking =
            document.getElementById(
                "thinking"
            );


        if (thinking) {
            thinking.remove();
        }


        addAIMessage(
            answer
        );


        conversation.push({

            role:"assistant",

            content:answer

        });


    }

    catch (error) {

        const thinking =
            document.getElementById(
                "thinking"
            );


        if (thinking) {
            thinking.remove();
        }


        if (
            error.name !==
            "AbortError"
        ) {

            console.error(
                "12n0name AI error:",
                error
            );


            addAIMessage(
                "⚠️ Server is down.\n\nPlease try again later."
            );
        }
    }


    finally {

        generating = false;

        controller = null;


        sendButton.classList.remove(
            "stop"
        );

        sendButton.textContent =
            "↑";
    }
}


/* =====================================================
   STOP GENERATION
   ===================================================== */

function stopGeneration() {

    if (controller) {

        controller.abort();

        controller = null;
    }


    const thinking =
        document.getElementById(
            "thinking"
        );


    if (thinking) {
        thinking.remove();
    }


    generating =
        false;


    const sendButton =
        document.getElementById(
            "sendButton"
        );


    sendButton.classList.remove(
        "stop"
    );

    sendButton.textContent =
        "↑";
}


/* =====================================================
   NEW CHAT
   ===================================================== */

function newChat() {

    stopGeneration();


    conversation = [];


    document.getElementById(
        "messages"
    ).innerHTML = "";


    document.getElementById(
        "welcome"
    ).style.display = "flex";


    input.value = "";

    input.style.height =
        "42px";


    document.getElementById(
        "sidebar"
    ).classList.remove(
        "open"
    );
}


/* =====================================================
   SCROLL
   ===================================================== */

function scrollToBottom() {

    const chat =
        document.getElementById(
            "chat"
        );


    chat.scrollTop =
        chat.scrollHeight;
}

</script>

</body>
</html>
