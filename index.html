<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>12n0name AI</title>

<style>

/* =========================================================
   THEME
========================================================= */

:root {
    --bg: #0b0d10;
    --sidebar: #111318;
    --surface: #171a20;
    --surface-2: #1d2129;
    --hover: #252a33;
    --border: #2b3039;

    --text: #f1f3f5;
    --secondary: #9aa1ac;
    --muted: #737b87;

    --accent: #ffffff;
    --accent-text: #0b0d10;

    --danger: #ff6b6b;
    --success: #52d273;
    --code-bg: #0a0c0f;
}

/* =========================================================
   LIGHT THEME
========================================================= */

body.light {
    --bg: #f5f6f8;
    --sidebar: #ffffff;
    --surface: #ffffff;
    --surface-2: #eef0f3;
    --hover: #e4e7eb;
    --border: #d5d9df;

    --text: #17191d;
    --secondary: #606772;
    --muted: #858b95;

    --accent: #17191d;
    --accent-text: #ffffff;

    --code-bg: #f0f1f3;
}

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: var(--bg);
    color: var(--text);

    overflow: hidden;
}

/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    position: fixed;

    left: 0;
    top: 0;
    bottom: 0;

    width: 280px;

    background: var(--sidebar);
    border-right: 1px solid var(--border);

    padding: 16px;

    z-index: 3000;

    display: none;

    box-shadow: 8px 0 30px rgba(0, 0, 0, 0.25);
}

.sidebar.open {
    display: block;
}

/* Sidebar top row */

.sidebar-header {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;

    margin-bottom: 24px;
}

/* Logo */

.logo {
    display: flex;
    align-items: center;

    gap: 10px;

    min-width: 0;
}

.logo-icon {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background: var(--accent);
    color: var(--accent-text);

    font-weight: 800;
    font-size: 14px;

    flex-shrink: 0;
}

.logo span {
    font-size: 17px;
    font-weight: 700;

    white-space: nowrap;
}

/* =========================================================
   SIDEBAR CLOSE BUTTON
========================================================= */

.sidebar-close {
    width: 40px;
    height: 40px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid var(--border);
    border-radius: 10px;

    background: var(--surface);

    color: var(--text);

    font-size: 28px;
    font-weight: 400;

    line-height: 1;

    cursor: pointer;

    padding: 0;

    opacity: 1;
    visibility: visible;

    transition:
        background 0.15s ease,
        border-color 0.15s ease,
        color 0.15s ease,
        transform 0.15s ease;
}

.sidebar-close:hover {
    background: var(--hover);
    border-color: var(--text);
}

.sidebar-close:active {
    transform: scale(0.92);
}

/* =========================================================
   NEW CHAT
========================================================= */

.new-chat {
    width: 100%;

    padding: 12px 14px;

    border: 1px solid var(--border);
    border-radius: 10px;

    background: var(--surface);

    color: var(--text);

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    transition: background 0.15s ease;
}

.new-chat:hover {
    background: var(--hover);
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    height: 62px;

    flex-shrink: 0;

    display: flex;
    align-items: center;

    gap: 14px;

    padding: 0 16px;

    border-bottom: 1px solid var(--border);

    background: var(--bg);
}

/* Menu */

.menu-button,
.theme-button {
    width: 40px;
    height: 40px;

    border: 1px solid var(--border);
    border-radius: 10px;

    background: var(--surface);

    color: var(--text);

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;
}

.menu-button:hover,
.theme-button:hover {
    background: var(--hover);
}

/* Model */

.model {
    font-size: 16px;
    font-weight: 700;
}

.model span {
    opacity: 0.55;
    font-weight: 500;
}

/* Status */

.status {
    margin-left: auto;

    display: flex;
    align-items: center;

    gap: 7px;

    color: var(--secondary);

    font-size: 13px;
}

.status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: var(--success);
}

/* =========================================================
   CHAT
========================================================= */

.chat {
    flex: 1;

    min-height: 0;

    display: flex;
    justify-content: center;

    overflow: hidden;
}

.messages {
    width: 100%;
    max-width: 900px;

    padding: 28px 18px 160px;

    overflow-y: auto;
    overflow-x: hidden;

    scroll-behavior: smooth;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome {
    min-height: 60vh;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}

.welcome h1 {
    margin: 0 0 10px;

    font-size: clamp(30px, 5vw, 48px);

    letter-spacing: -1.5px;
}

.welcome p {
    margin: 0;

    color: var(--secondary);

    font-size: 15px;
}

/* =========================================================
   MESSAGE
========================================================= */

.message {
    display: flex;

    margin-bottom: 24px;
}

.message.user {
    justify-content: flex-end;
}

.message.ai {
    justify-content: flex-start;
}

.bubble {
    max-width: 85%;

    padding: 13px 16px;

    border-radius: 15px;

    font-size: 15px;
    line-height: 1.65;

    overflow-wrap: anywhere;
}

.user .bubble {
    background: var(--surface-2);
    border: 1px solid var(--border);
}

.ai .bubble {
    background: transparent;

    padding-left: 0;
    padding-right: 0;
}

/* =========================================================
   MARKDOWN HEADINGS
========================================================= */

.md-heading {
    margin-top: 24px;
    margin-bottom: 10px;

    line-height: 1.3;

    letter-spacing: -0.3px;
}

.md-heading:first-child {
    margin-top: 0;
}

.md-heading.h1 {
    font-size: 28px;
}

.md-heading.h2 {
    font-size: 24px;
}

.md-heading.h3 {
    font-size: 20px;
}

.md-heading.h4 {
    font-size: 17px;
}

/* =========================================================
   MARKDOWN TEXT
========================================================= */

.md-paragraph {
    margin: 0 0 12px;
}

.md-bold {
    font-weight: 700;
}

.md-italic {
    font-style: italic;
}

.md-inline-code {
    background: var(--code-bg);

    border: 1px solid var(--border);

    border-radius: 6px;

    padding: 2px 6px;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 0.9em;
}

/* =========================================================
   CODE BLOCK
========================================================= */

.code-wrapper {
    position: relative;

    margin: 15px 0;

    border: 1px solid var(--border);
    border-radius: 12px;

    background: var(--code-bg);

    overflow: hidden;
}

.code-header {
    min-height: 38px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 7px 10px;

    border-bottom: 1px solid var(--border);

    color: var(--secondary);

    font-size: 12px;
}

.code-language {
    font-family:
        Consolas,
        "Courier New",
        monospace;
}

.copy-code {
    border: 1px solid var(--border);
    border-radius: 7px;

    background: var(--surface);

    color: var(--text);

    padding: 5px 9px;

    font-size: 12px;

    cursor: pointer;
}

.copy-code:hover {
    background: var(--hover);
}

.code-wrapper pre {
    margin: 0;

    padding: 15px;

    overflow-x: auto;

    white-space: pre;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 13px;

    line-height: 1.55;
}

.code-wrapper code {
    font-family: inherit;
}

/* =========================================================
   LISTS
========================================================= */

.md-list {
    margin: 8px 0 14px;

    padding-left: 25px;
}

.md-list li {
    margin: 5px 0;
}

/* =========================================================
   LINKS
========================================================= */

.md-link {
    color: #62a8ff;

    text-decoration: underline;

    text-underline-offset: 2px;
}

.md-link:hover {
    opacity: 0.8;
}

/* =========================================================
   BLOCKQUOTE
========================================================= */

.md-quote {
    margin: 14px 0;

    padding: 8px 14px;

    border-left: 3px solid var(--secondary);

    color: var(--secondary);

    background: var(--surface);
}

/* =========================================================
   HORIZONTAL RULE
========================================================= */

.md-hr {
    border: 0;

    border-top: 1px solid var(--border);

    margin: 20px 0;
}

/* =========================================================
   ERROR
========================================================= */

.error {
    color: var(--danger);
}

/* =========================================================
   GENERATING
========================================================= */

.generating {
    display: inline-flex;

    gap: 5px;

    align-items: center;
}

.generating span {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--secondary);

    animation: typing 1.2s infinite ease-in-out;
}

.generating span:nth-child(2) {
    animation-delay: 0.15s;
}

.generating span:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes typing {

    0%,
    60%,
    100% {
        transform: translateY(0);
        opacity: 0.4;
    }

    30% {
        transform: translateY(-4px);
        opacity: 1;
    }
}

/* =========================================================
   INPUT AREA
========================================================= */

.input-area {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    display: flex;
    justify-content: center;

    padding: 12px 16px 15px;

    background:
        linear-gradient(
            to top,
            var(--bg) 70%,
            transparent
        );

    z-index: 100;
}

.input-container {
    width: 100%;
    max-width: 900px;

    position: relative;

    display: flex;
    align-items: flex-end;

    gap: 8px;

    padding: 8px;

    border: 1px solid var(--border);
    border-radius: 15px;

    background: var(--surface);

    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
}

#prompt {
    flex: 1;

    min-height: 42px;
    max-height: 180px;

    resize: none;

    border: 0;
    outline: 0;

    background: transparent;

    color: var(--text);

    font-family: inherit;
    font-size: 15px;

    line-height: 1.5;

    padding: 10px 8px;
}

#prompt::placeholder {
    color: var(--muted);
}

/* =========================================================
   SEND / STOP
========================================================= */

.send-button,
.stop-button {
    width: 42px;
    height: 42px;

    flex-shrink: 0;

    border: 0;
    border-radius: 11px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 18px;
}

.send-button {
    background: var(--accent);
    color: var(--accent-text);
}

.send-button:hover {
    opacity: 0.85;
}

.stop-button {
    display: none;

    background: var(--danger);
    color: white;
}

.stop-button.show {
    display: flex;
}

/* =========================================================
   FOOTER
========================================================= */

.footer {
    position: absolute;

    bottom: -21px;

    left: 0;
    right: 0;

    text-align: center;

    color: var(--muted);

    font-size: 10px;
}

/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {
    width: 7px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: var(--border);

    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: var(--secondary);
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .sidebar {
        width: 285px;
    }

    .bubble {
        max-width: 94%;
    }

    .messages {
        padding-left: 12px;
        padding-right: 12px;
    }

    .topbar {
        padding: 0 10px;
    }

    .status {
        display: none;
    }

    .welcome h1 {
        font-size: 32px;
    }

}

/* =========================================================
   OVERLAY
========================================================= */

.sidebar-overlay {
    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.45);

    z-index: 2500;

    display: none;
}

.sidebar-overlay.show {
    display: block;
}

</style>

<div class="app">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">

            <div class="logo">

                <div class="logo-icon">
                    12
                </div>

                <span>
                    12n0name
                </span>

            </div>

            <!-- CLEARLY VISIBLE CLOSE BUTTON -->

            <button
                class="sidebar-close"
                id="sidebarClose"
                type="button"
                onclick="closeSidebar()"

            </button>

        <button

            type="button"

        </button>

    </aside>

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
        onclick="closeSidebar()">
    </div>

    <!-- =====================================================

    ====================================================== -->

    <header class="topbar">

        <button
            class="menu-button"
            type="button"
            onclick="toggleSidebar()"
            aria-label="Open menu">
            ☰
        </button>

        <div class="model">
            12n0name <span>AI</span>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            Online
        </div>

        <button
            class="theme-button"
            id="themeButton"
            type="button"
            onclick="toggleTheme()"
            aria-label="Toggle theme">
            🌙
        </button>

    </header>

    <!-- =====================================================
         CHAT
    ====================================================== -->

    <section class="chat">

        <div
            class="messages"
            id="messages">

            <div
                class="welcome"
                id="welcome">

                <h1>
                    What can I help with?
                </h1>

                <p>
                    Ask anything. Build anything. Explore anything.
                </p>

            </div>

        </div>

    </section>

         INPUT
    ====================================================== -->

    <div class="input-area">

        <div class="input-container">

            <textarea
                id="prompt"
                rows="1"
                placeholder="Message 12n0name AI..."
                autocomplete="off"
                spellcheck="true"></textarea>

            <button
                class="send-button"
                id="sendButton"
                type="button"
                onclick="sendMessage()"
                aria-label="Send">
                ➤
            </button>

            <button
                class="stop-button"
                id="stopButton"
                type="button"
                onclick="stopGeneration()"
                aria-label="Stop">
                ■
            </button>

            <div class="footer">
                12n0name AI
            </div>

        </div>

    </div>

</div>

<script>

/* =========================================================
   API
========================================================= */

const API_URL =
    "https://desktop-3fdvn7b.tail77d397.ts.net/v1/chat/completions";


/* =========================================================
   STATE
========================================================= */

let conversation = [];

let controller = null;

let generating = false;


/* =========================================================
   ELEMENTS
========================================================= */

const sidebar =
    document.getElementById("sidebar");

const sidebarOverlay =
    document.getElementById("sidebarOverlay");

const messages =
    document.getElementById("messages");

const prompt =
    document.getElementById("prompt");

const sendButton =
    document.getElementById("sendButton");

const stopButton =
    document.getElementById("stopButton");

const themeButton =
    document.getElementById("themeButton");


/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar() {

    const isOpen =
        sidebar.classList.toggle("open");

    sidebarOverlay.classList.toggle(
        "show",
        isOpen
    );
}


function closeSidebar() {

    sidebar.classList.remove("open");

    sidebarOverlay.classList.remove("show");
}


/* =========================================================
   THEME
========================================================= */

function toggleTheme() {

    document.body.classList.toggle("light");

    const light =
        document.body.classList.contains("light");

    themeButton.textContent =
        light ? "☀️" : "🌙";

    localStorage.setItem(
        "12n0name-theme",
        light ? "light" : "dark"
    );
}


(function loadTheme() {

    const saved =
        localStorage.getItem("12n0name-theme");

    if (saved === "light") {

        document.body.classList.add("light");

        themeButton.textContent = "☀️";
    }

})();


/* =========================================================
   NEW CHAT
========================================================= */

function newChat() {

    conversation = [];

    messages.innerHTML = `
        <div class="welcome" id="welcome">
            <h1>What can I help with?</h1>
            <p>Ask anything. Build anything. Explore anything.</p>
        </div>
    `;

    prompt.value = "";

    autoResize();

    closeSidebar();

    prompt.focus();
}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   INLINE MARKDOWN
========================================================= */

function formatInline(text) {

    let value = escapeHTML(text);


    /* Links */

    value = value.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a class="md-link" href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
    );


    /* Inline code */

    value = value.replace(
        /`([^`\n]+)`/g,
        '<code class="md-inline-code">$1</code>'
    );


    /* Bold */

    value = value.replace(
        /\*\*(.+?)\*\*/g,
        '<strong class="md-bold">$1</strong>'
    );


    /* Bold using __ */

    value = value.replace(
        /__(.+?)__/g,
        '<strong class="md-bold">$1</strong>'
    );


    /* Italic */

    value = value.replace(
        /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
        '<em class="md-italic">$1</em>'
    );


    /* Italic using _ */

    value = value.replace(
        /(?<!\w)_([^_\n]+)_(?!\w)/g,
        '<em class="md-italic">$1</em>'
    );


    return value;
}


/* =========================================================
   MARKDOWN FORMATTER
========================================================= */

function formatResponse(rawText) {

    if (rawText === null || rawText === undefined) {
        return "";
    }

    let text = String(rawText)
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n");


    /* -----------------------------------------------------
       EXTRACT CODE BLOCKS FIRST
    ----------------------------------------------------- */

    const codeBlocks = [];

    text = text.replace(
        /```([^\n`]*)\n?([\s\S]*?)```/g,
        function (_, language, code) {

            const index =
                codeBlocks.length;

            const cleanLanguage =
                language.trim() || "code";

            codeBlocks.push({
                language: cleanLanguage,
                code: code.replace(/\n$/, "")
            });

            return `@@CODEBLOCK_${index}@@`;
        }
    );


    /* -----------------------------------------------------
       ESCAPE NORMAL TEXT
    ----------------------------------------------------- */

    text = escapeHTML(text);


    /* -----------------------------------------------------
       HEADINGS
    ----------------------------------------------------- */

    text = text.replace(
        /^####\s+(.+)$/gm,
        '<h4 class="md-heading h4">$1</h4>'
    );

    text = text.replace(
        /^###\s+(.+)$/gm,
        '<h3 class="md-heading h3">$1</h3>'
    );

    text = text.replace(
        /^##\s+(.+)$/gm,
        '<h2 class="md-heading h2">$1</h2>'
    );

    text = text.replace(
        /^#\s+(.+)$/gm,
        '<h1 class="md-heading h1">$1</h1>'
    );


    /* -----------------------------------------------------
       HORIZONTAL RULE
    ----------------------------------------------------- */

    text = text.replace(
        /^(\*\*\*|---|___)\s*$/gm,
        '<hr class="md-hr">'
    );


    /* -----------------------------------------------------
       BLOCKQUOTES
    ----------------------------------------------------- */

    text = text.replace(
        /^&gt;\s?(.*)$/gm,
        '<div class="md-quote">$1</div>'
    );


    /* -----------------------------------------------------
       BULLET LISTS
    ----------------------------------------------------- */

    text = text.replace(
        /(?:^|\n)(?:[-*+]\s+.+(?:\n|$))+/g,
        function (block) {

            const items =
                block
                    .trim()
                    .split("\n")
                    .map(line =>
                        line.replace(
                            /^[-*+]\s+/,
                            ""
                        )
                    )
                    .map(item =>
                        `<li>${item}</li>`
                    )
                    .join("");

            return `<ul class="md-list">${items}</ul>`;
        }
    );


    /* -----------------------------------------------------
       NUMBERED LISTS
    ----------------------------------------------------- */

    text = text.replace(
        /(?:^|\n)(?:\d+\.\s+.+(?:\n|$))+/g,
        function (block) {

            const items =
                block
                    .trim()
                    .split("\n")
                    .map(line =>
                        line.replace(
                            /^\d+\.\s+/,
                            ""
                        )
                    )
                    .map(item =>
                        `<li>${item}</li>`
                    )
                    .join("");

            return `<ol class="md-list">${items}</ol>`;
        }
    );


    /* -----------------------------------------------------
       INLINE MARKDOWN
    ----------------------------------------------------- */

    /*
       Don't run inline formatting over HTML tags.
       Process only text portions outside tags.
    */

    text = text.replace(
        /(^|>)([^<]+)(?=<|$)/g,
        function (_, prefix, content) {

            if (
                content.includes("@@CODEBLOCK_")
            ) {
                return prefix + content;
            }

            return prefix +
                formatInline(
                    content
                        .replace(/&lt;br&gt;/g, "")
                );
        }
    );


    /* -----------------------------------------------------
       NEW LINES
    ----------------------------------------------------- */

    text = text.replace(
        /\n{2,}/g,
        '</p><p class="md-paragraph">'
    );

    text = text.replace(
        /\n/g,
        "<br>"
    );


    /* -----------------------------------------------------
       CODE BLOCKS
    ----------------------------------------------------- */

    text = text.replace(
        /@@CODEBLOCK_(\d+)@@/g,
        function (_, index) {

            const block =
                codeBlocks[Number(index)];

            const language =
                escapeHTML(block.language);

            const code =
                escapeHTML(block.code);

            return `
                <div class="code-wrapper">

                    <div class="code-header">

                        <span class="code-language">
                            ${language}
                        </span>

                        <button
                            class="copy-code"
                            type="button"
                            onclick="copyCode(this)">
                            Copy
                        </button>

                    </div>

                    <pre><code>${code}</code></pre>

                </div>
            `;
        }
    );


    /* -----------------------------------------------------
       CLEAN EMPTY PARAGRAPHS
    ----------------------------------------------------- */

    text = text
        .replace(
            /<p class="md-paragraph"><\/p>/g,
            ""
        )
        .trim();


    return text;
}


/* =========================================================
   COPY CODE
========================================================= */

async function copyCode(button) {

    const wrapper =
        button.closest(".code-wrapper");

    const code =
        wrapper.querySelector("code");

    if (!code) {
        return;
    }

    try {

        await navigator.clipboard.writeText(
            code.textContent
        );

        const oldText =
            button.textContent;

        button.textContent =
            "Copied!";

        setTimeout(() => {
            button.textContent =
                oldText;
        }, 1200);

    } catch (error) {

        button.textContent =
            "Failed";

        setTimeout(() => {
            button.textContent =
                "Copy";
        }, 1200);
    }
}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(role, content) {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }


    const message =
        document.createElement("div");

    message.className =
        `message ${role}`;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    if (role === "user") {

        bubble.textContent =
            content;

    } else {

        bubble.innerHTML =
            content;
    }


    message.appendChild(bubble);

    messages.appendChild(message);

    scrollToBottom();


    return message;
}


/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom() {

    requestAnimationFrame(() => {

        messages.scrollTop =
            messages.scrollHeight;

    });
}


/* =========================================================
   GENERATING MESSAGE
========================================================= */

function createGeneratingMessage() {

    return addMessage(
        "ai",
        `
        <div class="generating">
            <span></span>
            <span></span>
            <span></span>
        </div>
        `
    );
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    if (generating) {
        return;
    }


    const text =
        prompt.value.trim();


    if (!text) {
        return;
    }


    addMessage(
        "user",
        text
    );


    conversation.push({
        role: "user",
        content: text
    });


    prompt.value = "";

    autoResize();


    const aiMessage =
        createGeneratingMessage();


    generating = true;

    controller =
        new AbortController();


    sendButton.style.display =
        "none";

    stopButton.classList.add("show");


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        messages:
                            conversation,

                        temperature:
                            0.7,

                        max_tokens:
                            1024,

                        stream:
                            false

                    }),

                    signal:
                        controller.signal
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );
        }


        const data =
            await response.json();


        const choice =
            data?.choices?.[0];


        let reply =
            choice?.message?.content ??
            choice?.text ??
            "";


        /* Handle array content */

        if (Array.isArray(reply)) {

            reply =
                reply
                    .map(item => {

                        if (
                            typeof item ===
                            "string"
                        ) {
                            return item;
                        }

                        return item?.text ?? "";

                    })
                    .join("");
        }


        reply =
            String(reply);


        if (!reply.trim()) {

            throw new Error(
                "Empty response"
            );
        }


        aiMessage
            .querySelector(".bubble")
            .innerHTML =
            formatResponse(reply);


        conversation.push({
            role: "assistant",
            content: reply
        });


        scrollToBottom();


    } catch (error) {

        if (
            error.name ===
            "AbortError"
        ) {

            aiMessage.remove();

        } else {

            aiMessage
                .querySelector(".bubble")
                .innerHTML =

                `
                <span class="error">
                    ⚠️ Server is down.
                    <br><br>
                    Contact on
                    arfankn@gmail.com
                </span>
                `;
        }

    } finally {

        generating = false;

        controller = null;

        sendButton.style.display =
            "flex";

        stopButton.classList.remove(
            "show"
        );

        prompt.focus();
    }
}


/* =========================================================
   STOP GENERATION
========================================================= */

function stopGeneration() {

    if (controller) {

        controller.abort();

        controller = null;
    }

    generating = false;

    sendButton.style.display =
        "flex";

    stopButton.classList.remove(
        "show"
    );
}


/* =========================================================
   TEXTAREA AUTO RESIZE
========================================================= */

function autoResize() {

    prompt.style.height =
        "auto";

    prompt.style.height =
        Math.min(
            prompt.scrollHeight,
            180
        ) + "px";
}


prompt.addEventListener(
    "input",
    autoResize
);


/* =========================================================
   ENTER TO SEND
========================================================= */

prompt.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =========================================================
   ESC CLOSES SIDEBAR
========================================================= */

document.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Escape") {

            closeSidebar();
        }
    }
);


/* =========================================================
   INITIAL FOCUS
========================================================= */

prompt.focus();

</script>
