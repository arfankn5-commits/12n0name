<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>12n0name AI</title>

<style>

/* ================= THEME ================= */

:root {
    --bg: #0b0d10;
    --sidebar: #111318;
    --surface: #171a20;
    --hover: #22262e;
    --border: #292d35;
    --text: #ffffff;
    --secondary: #969ca8;
    --muted: #646a75;
    --user: #252a33;
    --cyan: #00e5ff;
    --purple: #7c4dff;
    --code: #0a0c0f;
}

body.light {
    --bg: #f7f8fa;
    --sidebar: #ffffff;
    --surface: #ffffff;
    --hover: #eef0f4;
    --border: #dfe2e8;
    --text: #17191d;
    --secondary: #626875;
    --muted: #8b919d;
    --user: #e9ebef;
    --cyan: #009fc0;
    --purple: #6941d9;
    --code: #f0f1f4;
}


/* ================= RESET ================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    transition: background .25s, color .25s;
}


/* ================= SIDEBAR ================= */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;

    width: 270px;

    background: var(--sidebar);
    border-right: 1px solid var(--border);

    padding: 18px;

    z-index: 1000;

    display: none;
}

.sidebar.open {
    display: block;
}


/* ================= LOGO ================= */

.logo {
    display: flex;
    align-items: center;
    gap: 11px;

    font-size: 20px;
    font-weight: 800;

    margin-bottom: 30px;
}

.logo-icon {
    width: 44px;
    height: 44px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #071b24,
            #17102e
        );

    border: 1px solid rgba(0,229,255,.75);

    color: white;

    font-size: 17px;
    font-weight: 900;

    letter-spacing: -2px;

    overflow: hidden;

    box-shadow:
        0 0 10px rgba(0,229,255,.5),
        0 0 28px rgba(124,60,255,.25);
}

.logo-icon::before {
    content: "";

    position: absolute;

    inset: 4px;

    border-radius: 10px;

    border: 1px solid rgba(255,255,255,.16);
}

.logo-icon::after {
    content: "";

    position: absolute;

    width: 75px;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00e5ff,
            #9b5cff,
            transparent
        );

    transform: rotate(-45deg);

    animation:
        scan 2.5s linear infinite;
}

@keyframes scan {

    0% {
        transform:
            translateX(-38px)
            rotate(-45deg);
    }

    100% {
        transform:
            translateX(38px)
            rotate(-45deg);
    }

}


/* ================= NEW CHAT ================= */

.new-chat {
    width: 100%;

    padding: 13px;

    border: 1px solid var(--border);

    border-radius: 11px;

    background: var(--surface);

    color: var(--text);

    font-size: 15px;

    cursor: pointer;
}

.new-chat:hover {
    background: var(--hover);
}


/* ================= MAIN ================= */

.main {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
}


/* ================= TOP BAR ================= */

.topbar {
    height: 64px;

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 0 18px;

    border-bottom:
        1px solid var(--border);
}


/* ================= MENU ================= */

.menu-button {
    width: 43px;
    height: 43px;

    border: none;

    border-radius: 10px;

    background: transparent;

    color: var(--text);

    font-size: 23px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;
}

.menu-button:hover {
    background: var(--hover);
}


/* ================= NAME ================= */

.model {
    font-size: 16px;
    font-weight: bold;
}

.model span {
    color: var(--cyan);
}


/* ================= STATUS ================= */

.status {
    display: flex;
    align-items: center;
    gap: 6px;

    color: var(--secondary);

    font-size: 12px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #42d392;

    box-shadow: 0 0 8px #42d392;
}


/* ================= THEME ================= */

.theme-button {
    width: 42px;
    height: 42px;

    margin-left: auto;

    border: none;

    border-radius: 10px;

    background: transparent;

    color: var(--text);

    font-size: 19px;

    cursor: pointer;
}

.theme-button:hover {
    background: var(--hover);
}


/* ================= CHAT ================= */

.chat {
    flex: 1;

    overflow-y: auto;

    padding:
        40px 20px 145px;
}

.messages {
    max-width: 850px;
    margin: auto;
}


/* ================= WELCOME ================= */

.welcome {
    text-align: center;

    margin-top: 15vh;
}

.welcome h1 {
    font-size: 43px;

    margin-bottom: 13px;

    background:
        linear-gradient(
            90deg,
            var(--text),
            var(--cyan),
            var(--purple)
        );

    -webkit-background-clip: text;

    color: transparent;
}

.welcome p {
    color: var(--secondary);
}


/* ================= MESSAGES ================= */

.message {
    display: flex;

    gap: 13px;

    margin: 25px 0;

    animation:
        appear .25s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.message.user {
    justify-content: flex-end;
}

.message.user .bubble {
    background: var(--user);
}

.msg-avatar {
    min-width: 35px;
    height: 35px;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--purple)
        );

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    font-size: 12px;

    font-weight: bold;
}

.bubble {
    max-width: 75%;

    padding: 12px 15px;

    border-radius: 14px;

    line-height: 1.6;

    color: var(--text);

    overflow-wrap: anywhere;
}


/* ================= MARKDOWN ================= */

.bubble strong {
    font-weight: 700;
}

.bubble em {
    font-style: italic;
}

.bubble code.inline-code {
    background: var(--code);

    border: 1px solid var(--border);

    border-radius: 5px;

    padding: 2px 5px;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 13px;
}


/* ================= CODE BLOCK ================= */

.code-block {
    margin: 14px 0;

    background: var(--code);

    border: 1px solid var(--border);

    border-radius: 11px;

    overflow: hidden;

    width: 100%;
}

.code-header {
    height: 38px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 10px 0 13px;

    background:
        rgba(255,255,255,.035);

    border-bottom:
        1px solid var(--border);
}

.code-language {
    color: var(--secondary);

    font-size: 11px;

    font-weight: bold;

    text-transform: uppercase;

    letter-spacing: .5px;
}

.copy-button {
    border: 1px solid var(--border);

    background: var(--surface);

    color: var(--secondary);

    border-radius: 7px;

    padding: 5px 10px;

    font-size: 11px;

    cursor: pointer;

    transition: .15s;
}

.copy-button:hover {
    background: var(--hover);

    color: var(--text);
}

.copy-button.copied {
    color: var(--cyan);

    border-color:
        rgba(0,229,255,.4);
}

.code-content {
    display: block;

    padding: 14px;

    overflow-x: auto;

    white-space: pre;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 13px;

    line-height: 1.55;

    color: var(--text);

    tab-size: 4;
}


/* ================= INPUT ================= */

.input-area {
    position: fixed;

    bottom: 0;

    left: 0;
    right: 0;

    padding:
        18px 20px 20px;

    background:
        linear-gradient(
            transparent,
            var(--bg) 35%
        );
}

.input-box {
    max-width: 850px;

    margin: auto;

    background: var(--surface);

    border:
        1px solid var(--border);

    border-radius: 17px;

    display: flex;

    align-items: flex-end;

    padding: 9px;
}

textarea {
    flex: 1;

    resize: none;

    background: transparent;

    border: none;

    outline: none;

    color: var(--text);

    font-size: 15px;

    padding: 10px;

    font-family: inherit;

    max-height: 180px;
}

textarea::placeholder {
    color: var(--muted);
}


/* ================= SEND ================= */

.send {
    width: 43px;
    height: 43px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--purple)
        );

    color: white;

    cursor: pointer;

    font-size: 18px;

    transition: .2s;
}

.send:hover {
    transform: scale(1.06);
}

.send:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none;
}


/* ================= STOP ================= */

.stop {
    display: none;

    width: 43px;
    height: 43px;

    border: none;

    border-radius: 12px;

    background: #333842;

    color: white;

    cursor: pointer;

    font-size: 16px;
}


/* ================= ERROR ================= */

.error {
    color: #ff6b6b;
}


/* ================= FOOTER ================= */

.footer {
    text-align: center;

    color: var(--muted);

    font-size: 11px;

    margin-top: 8px;
}


/* ================= MOBILE ================= */

@media (max-width: 700px) {

    .sidebar {
        width: 280px;
    }

    .welcome h1 {
        font-size: 32px;
    }

    .bubble {
        max-width: 85%;
    }

    .status {
        display: none;
    }

    .code-content {
        font-size: 12px;
    }

}

</style>

</head>


<body>


<!-- ================= SIDEBAR ================= -->

<aside
    class="sidebar"
    id="sidebar">

    <div class="logo">

        <div class="logo-icon">
            12
        </div>

        <span>
            12n0name
        </span>

    </div>


    <button
        class="new-chat"
        onclick="newChat()">

        ＋ New chat

    </button>

</aside>


<!-- ================= MAIN ================= -->

<main class="main">


    <!-- ================= TOP BAR ================= -->

    <header class="topbar">

        <button
            class="menu-button"
            type="button"
            onclick="toggleSidebar()">

            ☰

        </button>


        <div class="model">

            12n0name
            <span>AI</span>

        </div>


        <div class="status">

            <span class="status-dot"></span>

            Online

        </div>


        <button
            class="theme-button"
            id="themeButton"
            type="button"
            onclick="toggleTheme()">

            🌙

        </button>

    </header>


    <!-- ================= CHAT ================= -->

    <section
        class="chat"
        id="chat">

        <div
            class="messages"
            id="messages">

            <div
                class="welcome"
                id="welcome">

                <h1>
                    What can I help with?
                </h1>

                <p>
                    Ask anything. Build anything.
                    Explore anything.
                </p>

            </div>

        </div>

    </section>


    <!-- ================= MESSAGE BOX ================= -->

    <div class="input-area">

        <div class="input-box">

            <textarea
                id="input"
                rows="1"
                placeholder="Ask 12n0name..."></textarea>


            <button
                class="send"
                id="sendButton"
                type="button"
                onclick="sendMessage()">

                ➤

            </button>


            <button
                class="stop"
                id="stopButton"
                type="button"
                onclick="stopGeneration()">

                ■

            </button>

        </div>


        <div class="footer">

            12n0name AI can make mistakes.
            Check important information.

        </div>

    </div>

</main>


<script>

/* =========================================================
   API
   ========================================================= */

const API_URL =
    "https://desktop-3fdvn7b.tail77d397.ts.net/v1/chat/completions";


/* =========================================================
   STATE
   ========================================================= */

let conversation = [];

let controller = null;

let generating = false;


/* =========================================================
   ELEMENTS
   ========================================================= */

const input =
    document.getElementById("input");

const messages =
    document.getElementById("messages");

const sendButton =
    document.getElementById("sendButton");

const stopButton =
    document.getElementById("stopButton");


/* =========================================================
   SIDEBAR
   ========================================================= */

function toggleSidebar() {

    const sidebar =
        document.getElementById("sidebar");

    sidebar.classList.toggle("open");

}


/* =========================================================
   THEME
   ========================================================= */

function toggleTheme() {

    document.body.classList.toggle("light");

    const isLight =
        document.body.classList.contains("light");

    const themeButton =
        document.getElementById("themeButton");

    if (isLight) {

        themeButton.textContent = "☀️";

        localStorage.setItem(
            "theme",
            "light"
        );

    } else {

        themeButton.textContent = "🌙";

        localStorage.setItem(
            "theme",
            "dark"
        );

    }

}


/* =========================================================
   LOAD THEME
   ========================================================= */

if (
    localStorage.getItem("theme")
    === "light"
) {

    document.body.classList.add("light");

    document.getElementById(
        "themeButton"
    ).textContent = "☀️";

}


/* =========================================================
   INPUT
   ========================================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   AUTO RESIZE
   ========================================================= */

input.addEventListener(
    "input",
    function() {

        this.style.height = "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                180
            ) + "px";

    }
);


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage() {

    if (generating)
        return;


    const text =
        input.value.trim();

    if (!text)
        return;


    const welcome =
        document.getElementById("welcome");

    if (welcome)
        welcome.remove();


    addMessage(
        text,
        "user"
    );


    conversation.push({
        role: "user",
        content: text
    });


    input.value = "";

    input.style.height = "auto";


    setGenerating(true);


    const aiMessage =
        createAIMessage();


    controller =
        new AbortController();


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        messages:
                            conversation,

                        temperature:
                            0.7,

                        /*
                           Increased from 1024
                           to allow much longer
                           AI responses.
                        */

                        max_tokens:
                            8192,

                        stream:
                            false

                    }),

                    signal:
                        controller.signal

                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
           Handle llama.cpp response formats.
        */

        const choice =
            data?.choices?.[0];

        let reply =
            choice?.message?.content ??
            choice?.text ??
            "";


        /*
           Some responses use an array.
        */

        if (Array.isArray(reply)) {

            reply =
                reply
                .map(function(item) {

                    if (
                        typeof item ===
                        "string"
                    ) {

                        return item;

                    }

                    return (
                        item?.text ??
                        ""
                    );

                })
                .join("");

        }


        /*
           Final conversion.
        */

        if (
            typeof reply !==
            "string"
        ) {

            reply =
                JSON.stringify(reply);

        }


        if (!reply.trim()) {

            throw new Error(
                "Empty AI response"
            );

        }


        aiMessage.querySelector(
            ".bubble"
        ).innerHTML =
            formatResponse(reply);


        conversation.push({
            role: "assistant",
            content: reply
        });


        scrollBottom();

    }

    catch (error) {

        if (
            error.name ===
            "AbortError"
        ) {

            aiMessage.remove();

            return;

        }


        console.error(
            "AI Error:",
            error
        );


        aiMessage.querySelector(
            ".bubble"
        ).innerHTML =

            '<span class="error">' +
            '⚠️ Server is down.<br><br>' +
            'Please make sure llama.cpp and ' +
            'Tailscale Funnel are running.' +
            '</span>';

    }

    finally {

        controller = null;

        setGenerating(false);

    }

}


/* =========================================================
   GENERATING STATE
   ========================================================= */

function setGenerating(state) {

    generating = state;

    sendButton.style.display =
        state ? "none" : "block";

    stopButton.style.display =
        state ? "block" : "none";

    input.disabled = state;

}


/* =========================================================
   STOP GENERATION
   ========================================================= */

function stopGeneration() {

    if (controller) {

        controller.abort();

    }

}


/* =========================================================
   CREATE AI MESSAGE
   ========================================================= */

function createAIMessage() {

    const message =
        document.createElement("div");

    message.className =
        "message ai";


    message.innerHTML = `

        <div class="msg-avatar">
            12
        </div>

        <div class="bubble">
            Thinking...
        </div>

    `;


    messages.appendChild(message);

    scrollBottom();


    return message;

}


/* =========================================================
   ADD MESSAGE
   ========================================================= */

function addMessage(
    text,
    type
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    if (type === "ai") {

        message.innerHTML = `

            <div class="msg-avatar">
                12
            </div>

            <div class="bubble">
                ${formatResponse(text)}
            </div>

        `;

    } else {

        message.innerHTML = `

            <div class="bubble">
                ${escapeHTML(text)}
            </div>

        `;

    }


    messages.appendChild(message);

    scrollBottom();

}


/* =========================================================
   FORMAT AI RESPONSE
   ========================================================= */

function formatResponse(text) {

    if (!text)
        return "";


    let safe =
        escapeHTML(text);


    const codeBlocks = [];


    safe =
        safe.replace(
            /```([a-zA-Z0-9_+#.-]*)[ \t]*\r?\n?([\s\S]*?)```/g,

            function(
                match,
                language,
                code
            ) {

                const id =
                    codeBlocks.length;


                const decodedCode =
                    decodeHTMLEntities(
                        code
                    );


                codeBlocks.push({

                    language:
                        language || "code",

                    code:
                        decodedCode
                        .replace(
                            /^\r?\n/,
                            ""
                        )
                        .replace(
                            /\r?\n$/,
                            ""
                        )

                });


                return (
                    "___CODE_BLOCK_" +
                    id +
                    "___"
                );

            }
        );


    safe =
        safe.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


    safe =
        safe.replace(
            /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
            "<em>$1</em>"
        );


    safe =
        safe.replace(
            /`([^`\n]+)`/g,
            '<code class="inline-code">$1</code>'
        );


    safe =
        safe.replace(
            /\r?\n/g,
            "<br>"
        );


    codeBlocks.forEach(
        function(block, index) {

            const placeholder =
                "___CODE_BLOCK_" +
                index +
                "___";


            const safeCode =
                escapeHTML(
                    block.code
                );


            const html =

                '<div class="code-block">' +

                    '<div class="code-header">' +

                        '<span class="code-language">' +
                            escapeHTML(
                                block.language
                            ) +
                        '</span>' +

                        '<button ' +
                            'class="copy-button" ' +
                            'type="button" ' +
                            'onclick="copyCode(this)">' +
                            'Copy' +
                        '</button>' +

                    '</div>' +

                    '<code class="code-content">' +
                        safeCode +
                    '</code>' +

                '</div>';


            safe =
                safe.replace(
                    placeholder,
                    html
                );

        }
    );


    return safe;

}


/* =========================================================
   DECODE HTML ENTITIES
   ========================================================= */

function decodeHTMLEntities(text) {

    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.innerHTML =
        text;


    return textarea.value;

}


/* =========================================================
   COPY CODE
   ========================================================= */

async function copyCode(button) {

    const codeBlock =
        button.closest(
            ".code-block"
        );


    if (!codeBlock)
        return;


    const code =
        codeBlock.querySelector(
            ".code-content"
        );


    if (!code)
        return;


    const text =
        code.textContent;


    try {

        await navigator.clipboard.writeText(
            text
        );


        button.textContent =
            "Copied!";


        button.classList.add(
            "copied"
        );


        setTimeout(
            function() {

                button.textContent =
                    "Copy";

                button.classList.remove(
                    "copied"
                );

            },
            1200
        );

    }

    catch (error) {

        console.error(
            "Clipboard error:",
            error
        );


        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        textarea.style.position =
            "fixed";

        textarea.style.left =
            "-9999px";


        document.body.appendChild(
            textarea
        );


        textarea.select();


        try {

            document.execCommand(
                "copy"
            );


            button.textContent =
                "Copied!";


            button.classList.add(
                "copied"
            );


            setTimeout(
                function() {

                    button.textContent =
                        "Copy";

                    button.classList.remove(
                        "copied"
                    );

                },
                1200
            );

        }

        catch (fallbackError) {

            button.textContent =
                "Failed";

        }


        textarea.remove();

    }

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(text);


    return div.innerHTML;

}


/* =========================================================
   SCROLL
   ========================================================= */

function scrollBottom() {

    const chat =
        document.getElementById(
            "chat"
        );


    chat.scrollTo({

        top:
            chat.scrollHeight,

        behavior:
            "smooth"

    });

}

/* =========================================================
   CLOSE SIDEBAR ON OUTSIDE CLICK
   ========================================================= */

document.addEventListener(
    "click",
    function(event) {

        const sidebar =
            document.getElementById(
                "sidebar"
            );


        const menu =
            document.querySelector(
                ".menu-button"
            );


        if (
            sidebar.classList.contains("open") &&
            !sidebar.contains(event.target) &&
            !menu.contains(event.target)
        ) {

            sidebar.classList.remove(
                "open"
            );

        }

    }
);
