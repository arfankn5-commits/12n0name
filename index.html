<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIWORLD</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #0f1117;
    --header: #171a22;
    --input: #1b1f29;
    --border: #2a2f3a;
    --text: #ffffff;
    --muted: #9ca3af;
    --user: #2563eb;
    --button: #2563eb;
    --stop: #ef4444;
}

body.light {
    --bg: #f5f7fb;
    --header: #ffffff;
    --input: #ffffff;
    --border: #d9dee8;
    --text: #111827;
    --muted: #6b7280;
    --user: #2563eb;
    --button: #2563eb;
    --stop: #dc2626;
}

body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.25s, color 0.25s;
}

/* HEADER */

header {
    height: 64px;
    background: var(--header);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.logo span {
    color: #3b82f6;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.status {
    color: #22c55e;
    font-size: 13px;
}

.header-button {
    background: var(--input);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    cursor: pointer;
    font-size: 14px;
}

.header-button:hover {
    opacity: 0.8;
}

/* CHAT */

main {
    flex: 1;
    overflow-y: auto;
    padding: 30px 15px 120px;
}

.welcome {
    text-align: center;
    margin-top: 25vh;
}

.welcome h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

.welcome p {
    color: var(--muted);
}

/* MESSAGES */

.message {
    max-width: 800px;
    margin: 0 auto 22px;
    display: flex;
}

.user-message {
    justify-content: flex-end;
}

.user-bubble {
    background: var(--user);
    color: white;
    padding: 12px 16px;
    border-radius: 18px 18px 4px 18px;
    max-width: 75%;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.ai-message {
    justify-content: flex-start;
}

.ai-bubble {
    background: var(--input);
    border: 1px solid var(--border);
    padding: 14px 16px;
    border-radius: 18px 18px 18px 4px;
    max-width: 85%;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

/* SERVER ERROR */

.server-error {
    color: #ef4444;
    font-weight: 500;
}

/* THINKING */

.thinking {
    display: flex;
    gap: 5px;
    align-items: center;
}

.dot {
    width: 7px;
    height: 7px;
    background: var(--muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
}

.dot:nth-child(2) {
    animation-delay: 0.15s;
}

.dot:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes bounce {
    0%, 60%, 100% {
        transform: translateY(0);
    }

    30% {
        transform: translateY(-5px);
    }
}

/* FOOTER */

footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg);
    padding: 12px 15px 15px;
    border-top: 1px solid var(--border);
}

.input-container {
    max-width: 800px;
    margin: auto;
}

.input-box {
    display: flex;
    align-items: center;
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 5px;
}

#userInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    padding: 12px;
    font-size: 16px;
}

#userInput::placeholder {
    color: var(--muted);
}

/* SEND BUTTON */

#sendButton,
#stopButton {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 21px;
    cursor: pointer;
    flex-shrink: 0;
}

#sendButton {
    background: var(--button);
}

#sendButton:hover {
    opacity: 0.85;
}

#sendButton:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* STOP BUTTON */

#stopButton {
    background: var(--stop);
    display: none;
    font-size: 18px;
    transition: transform 0.15s;
}

#stopButton:hover {
    transform: scale(1.05);
}

#stopButton:active {
    transform: scale(0.95);
}

/* DISCLAIMER */

.disclaimer {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin-top: 8px;
}

/* MOBILE */

@media (max-width: 600px) {

    header {
        padding: 0 12px;
    }

    .logo {
        font-size: 18px;
    }

    .status {
        display: none;
    }

    .header-button {
        padding: 8px 10px;
    }

    .welcome h1 {
        font-size: 25px;
    }

    .user-bubble,
    .ai-bubble {
        max-width: 90%;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        AI<span>WORLD</span>
    </div>

    <div class="header-right">

        <div class="status">
            ● Local AI
        </div>

        <button
            class="header-button"
            id="themeButton"
            onclick="toggleTheme()">
            🌙
        </button>

        <button
            class="header-button"
            onclick="newChat()">
            + New
        </button>

    </div>

</header>

<main id="chatContainer">

    <div class="welcome" id="welcome">

        <h1>
            How can I help?
        </h1>

        <p>
            Your local AI assistant
        </p>

    </div>

</main>

<footer>

    <div class="input-container">

        <div class="input-box">

            <input
                id="userInput"
                type="text"
                placeholder="Message AIWORLD..."
                autocomplete="off">

            <button
                id="sendButton"
                onclick="sendMessage()">
                ↑
            </button>

            <button
                id="stopButton"
                onclick="stopGenerating()"
                title="Stop generating">
                ■
            </button>

        </div>

        <div class="disclaimer">
            AIWORLD may make mistakes.
            Check important information.
        </div>

    </div>

</footer>

<script>

/* =========================================
   LLAMA.CPP SERVER
   ========================================= */

/*
   PUT YOUR CURRENT SERVER URL HERE.

   Example:
   const API_URL = "http://192.168.1.100:8080/v1/chat/completions";

   If using your current Cloudflare Tunnel:
   const API_URL = "https://YOUR-CURRENT-TUNNEL/v1/chat/completions";
*/

const API_URL =
    "SET CURRENT CLOUD SERVER";


/* =========================================
   VARIABLES
   ========================================= */

let conversation = [];
let controller = null;
let isGenerating = false;

const chatContainer =
    document.getElementById("chatContainer");

const userInput =
    document.getElementById("userInput");

const sendButton =
    document.getElementById("sendButton");

const stopButton =
    document.getElementById("stopButton");

const themeButton =
    document.getElementById("themeButton");


/* =========================================
   THEME
   ========================================= */

function toggleTheme() {

    document.body.classList.toggle("light");

    const isLight =
        document.body.classList.contains("light");

    localStorage.setItem(
        "aiworld-theme",
        isLight ? "light" : "dark"
    );

    updateThemeButton();
}


function updateThemeButton() {

    const isLight =
        document.body.classList.contains("light");

    themeButton.textContent =
        isLight ? "☀️" : "🌙";
}


function loadTheme() {

    const savedTheme =
        localStorage.getItem("aiworld-theme");

    if (savedTheme === "light") {
        document.body.classList.add("light");
    } else {
        document.body.classList.remove("light");
    }

    updateThemeButton();
}


/* =========================================
   NEW CHAT
   ========================================= */

function newChat() {

    if (controller) {

        controller.abort();
        controller = null;

    }

    isGenerating = false;

    showSendButton();

    conversation = [];

    chatContainer.innerHTML = `

        <div class="welcome" id="welcome">

            <h1>
                How can I help?
            </h1>

            <p>
                Your local AI assistant
            </p>

        </div>

    `;

    userInput.value = "";

    userInput.focus();
}


/* =========================================
   USER MESSAGE
   ========================================= */

function addUserMessage(text) {

    const message =
        document.createElement("div");

    message.className =
        "message user-message";

    const bubble =
        document.createElement("div");

    bubble.className =
        "user-bubble";

    bubble.textContent =
        text;

    message.appendChild(bubble);

    chatContainer.appendChild(message);
}


/* =========================================
   AI MESSAGE
   ========================================= */

function createAIMessage() {

    const message =
        document.createElement("div");

    message.className =
        "message ai-message";

    const bubble =
        document.createElement("div");

    bubble.className =
        "ai-bubble";

    bubble.innerHTML = `

        <div class="thinking">

            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>

        </div>

    `;

    message.appendChild(bubble);

    chatContainer.appendChild(message);

    return bubble;
}


/* =========================================
   SHOW STOP BUTTON
   ========================================= */

function showStopButton() {

    sendButton.style.display = "none";

    stopButton.style.display = "block";
}


/* =========================================
   SHOW SEND BUTTON
   ========================================= */

function showSendButton() {

    sendButton.style.display = "block";

    stopButton.style.display = "none";
}


/* =========================================
   STOP GENERATING
   ========================================= */

function stopGenerating() {

    if (!controller) {
        return;
    }

    controller.abort();

    controller = null;

    isGenerating = false;

    showSendButton();

    sendButton.disabled = false;

    userInput.focus();
}


/* =========================================
   SEND MESSAGE
   ========================================= */

async function sendMessage() {

    if (isGenerating) {
        return;
    }

    const text =
        userInput.value.trim();

    if (!text) {
        return;
    }

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    addUserMessage(text);

    conversation.push({
        role: "user",
        content: text
    });

    userInput.value = "";

    isGenerating = true;

    sendButton.disabled = true;

    showStopButton();

    controller =
        new AbortController();

    const currentController =
        controller;

    const aiBubble =
        createAIMessage();

    scrollToBottom();

    try {

        const response =
            await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    messages:
                        conversation,

                    temperature:
                        0.7,

                    max_tokens:
                        1024,

                    stream:
                        false

                }),

                signal:
                    currentController.signal

            });

        if (!response.ok) {

            throw new Error(
                "Server is down"
            );

        }

        const data =
            await response.json();

        const answer =
            data?.choices?.[0]?.message?.content;

        if (
            !answer ||
            !answer.trim()
        ) {

            throw new Error(
                "Server is down"
            );

        }

        aiBubble.innerHTML =
            formatResponse(answer);

        conversation.push({

            role:
                "assistant",

            content:
                answer

        });

    } catch (error) {

        if (
            error.name ===
            "AbortError"
        ) {

            aiBubble.innerHTML = `

                <span style="
                    color: var(--muted);
                    font-size: 13px;
                ">
                    Generation stopped.
                </span>

            `;

        } else {

            console.error(error);

            aiBubble.innerHTML = `

                <div class="server-error">

                    ⚠️ Server is down.

                    <br><br>

                    Please try again later.

                </div>

            `;
        }
    }

    if (controller === currentController) {
        controller = null;
    }

    isGenerating = false;

    showSendButton();

    sendButton.disabled = false;

    userInput.focus();

    scrollToBottom();
}


/* =========================================
   FORMAT RESPONSE
   ========================================= */

function formatResponse(text) {

    /*
       Escape HTML first so AI output cannot
       accidentally become page HTML.
    */

    const escaped =
        escapeHtml(text);

    /*
       Preserve normal line breaks.
    */

    return escaped.replace(
        /\r?\n/g,
        "<br>"
    );
}


/* =========================================
   ESCAPE HTML
   ========================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;
}


/* =========================================
   SCROLL
   ========================================= */

function scrollToBottom() {

    chatContainer.scrollTop =
        chatContainer.scrollHeight;
}


/* =========================================
   ENTER KEY
   ========================================= */

userInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================
   START
   ========================================= */

loadTheme();

userInput.focus();

</script>

</body>
</html>
