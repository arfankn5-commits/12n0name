<style>

    --bg: #0b0d10;
    --sidebar: #111318;
    --surface: #171a20;
    --hover: #22262e;
    --border: #292d35;
    --text: #ffffff;
    --secondary: #969ca8;
    --muted: #646a75;
    --user: #252a33;

    --purple: #7c4dff;

body.light {
    --bg: #f7f8fa;
    --sidebar: #ffffff;
    --surface: #ffffff;

    --border: #dfe2e8;
    --text: #17191d;

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    transition: background .25s, color .25s;
}


/* ================= SIDEBAR ================= */

.sidebar {
    position: fixed;

    left: 0;
    top: 0;
    bottom: 0;

    width: 270px;

    background: var(--sidebar);

    border-right: 1px solid var(--border);

    padding: 18px;

    z-index: 1000;

    display: none;
}

.sidebar.open {
    display: block;

/* ================= LOGO ================= */

.logo {
    display: flex;
    align-items: center;
    gap: 11px;

    font-size: 20px;
    font-weight: 800;

    margin-bottom: 30px;
}

.logo-icon {
    width: 44px;
    height: 44px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #071b24,
            #17102e
        );

    border: 1px solid rgba(0,229,255,.75);

    color: white;

    font-size: 17px;
    font-weight: 900;

    letter-spacing: -2px;

    overflow: hidden;

    box-shadow:
        0 0 10px rgba(0,229,255,.5),
        0 0 28px rgba(124,60,255,.25);
}

.logo-icon::before {
    content: "";

    position: absolute;

    inset: 4px;

    border-radius: 10px;

    border: 1px solid rgba(255,255,255,.16);
}

.logo-icon::after {
    content: "";

    position: absolute;

    width: 75px;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00e5ff,
            #9b5cff,
            transparent
        );

    transform: rotate(-45deg);

    animation:
        scan 2.5s linear infinite;
}

@keyframes scan {

    0% {
        transform:
            translateX(-38px)
            rotate(-45deg);
    }

    100% {
        transform:
            translateX(38px)
            rotate(-45deg);
    }

}

<body>


<!-- ================= SIDEBAR ================= -->

<aside

<!-- ================= MAIN ================= -->

<main class="main">

        </button>

<script>

/* ================= SIDEBAR ================= */

function toggleSidebar() {

    const sidebar =
        document.getElementById("sidebar");

    sidebar.classList.toggle("open");

}


/* ================= THEME ================= */

function toggleTheme() {

    document.body.classList.toggle("light");

    const isLight =
        document.body.classList.contains("light");

    const themeButton =
        document.getElementById("themeButton");

    if (isLight) {

        themeButton.textContent = "☀️";

        localStorage.setItem(
            "theme",
            "light"
        );

    } else {

        themeButton.textContent = "🌙";

        localStorage.setItem(
            "theme",
            "dark"
        );

    }

}


/* ================= LOAD THEME ================= */

if (
    localStorage.getItem("theme")
    === "light"
) {

    document.body.classList.add("light");

    document.getElementById(
        "themeButton"
    ).textContent = "☀️";

}


/* ================= INPUT ================= */

const input =
    document.getElementById("input");

const messages =
    document.getElementById("messages");


input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ================= SEND MESSAGE ================= */

function sendMessage() {

    const text =
        input.value.trim();

    if (!text)
        return;


    const welcome =
        document.getElementById("welcome");

    if (welcome)
        welcome.remove();


    addMessage(
        text,
        "user"
    );


    input.value = "";


    /*
       Demo response.

       Replace this section with your
       llama.cpp API request later.
    */

    setTimeout(function() {

        addMessage(

            "Hello! 👋 I'm **12n0name AI**.\n\n" +

            "I can now display:\n\n" +

            "- Bullet points\n" +
            "- Numbered lists\n" +
            "- **Bold text**\n" +
            "- *Italic text*\n" +
            "- `inline code`\n\n" +

            "Example:\n\n" +

            "```python\n" +
            "print(\"Hello, world!\")\n" +
            "```\n\n" +

            "The interface keeps the same design.",

            "ai"

        );

    }, 700);

}


/* ================= ADD MESSAGE ================= */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    if (type === "ai") {

        message.innerHTML = `

            <div class="msg-avatar">
                12
            </div>

            <div class="bubble">

                <div class="ai-content">

                    ${formatAIResponse(text)}

                </div>

            </div>

        `;

    } else {

        message.innerHTML = `

            <div class="bubble">
                ${escapeHTML(text)}
            </div>

        `;

    }


    messages.appendChild(message);

    addCopyButtons();

    scrollBottom();

}


/* ================= AI FORMATTER ================= */

function formatAIResponse(text) {

    /*
       First escape everything so AI output
       cannot execute HTML or JavaScript.
    */

    let safe =
        escapeHTML(text);


    /*
       Extract fenced code blocks before
       processing Markdown-like formatting.
    */

    const codeBlocks = [];

    safe = safe.replace(
        /```([a-zA-Z0-9_+#.-]*)\n?([\s\S]*?)```/g,
        function(match, language, code) {

            const id =
                "code_" +
                codeBlocks.length;

            codeBlocks.push({
                id: id,
                language:
                    language || "code",
                code: code
            });

            return "\n@@@" + id + "@@@\n";

        }
    );


    /*
       Process headings.
    */

    safe = safe.replace(
        /^### (.+)$/gm,
        "<h3>$1</h3>"
    );

    safe = safe.replace(
        /^## (.+)$/gm,
        "<h2>$1</h2>"
    );

    safe = safe.replace(
        /^# (.+)$/gm,
        "<h1>$1</h1>"
    );


    /*
       Horizontal rule.
    */

    safe = safe.replace(
        /^---$/gm,
        "<hr>"
    );


    /*
       Blockquotes.
    */

    safe = safe.replace(
        /^&gt; (.+)$/gm,
        "<blockquote>$1</blockquote>"
    );


    /*
       Bold.
    */

    safe = safe.replace(
        /\*\*(.+?)\*\*/g,
        "<strong>$1</strong>"
    );

    safe = safe.replace(
        /__(.+?)__/g,
        "<strong>$1</strong>"
    );


    /*
       Italic.
    */

    safe = safe.replace(
        /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
        "<em>$1</em>"
    );


    /*
       Inline code.
    */

    safe = safe.replace(
        /`([^`\n]+)`/g,
        '<code class="inline-code">$1</code>'
    );


    /*
       Convert bullet lists.
    */

    safe =
        formatLists(
            safe
        );


    /*
       Convert normal line breaks.
    */

    safe = safe.replace(
        /\r?\n/g,
        "<br>"
    );


    /*
       Restore code blocks.
    */

    codeBlocks.forEach(function(block) {

        const escapedCode =
            block.code;

        const codeHTML = `

            <div class="code-wrapper">

                <div class="code-header">

                    <span>
                        ${escapeHTML(block.language)}
                    </span>

                    <button
                        class="copy-code"
                        type="button"
                        data-code="${encodeURIComponent(block.code)}">

                        Copy

                    </button>

                </div>

                <pre><code>${escapedCode}</code></pre>

            </div>

        `;

        safe = safe.replace(
            "@@@" + block.id + "@@@",
            codeHTML
        );

    });


    return safe;

}


/* ================= LIST FORMATTER ================= */

function formatLists(text) {

    const lines =
        text.split("\n");

    let result = [];

    let inUL = false;
    let inOL = false;


    function closeLists() {

        if (inUL) {

            result.push("</ul>");

            inUL = false;

        }

        if (inOL) {

            result.push("</ol>");

            inOL = false;

        }

    }


    lines.forEach(function(line) {

        /*
           Bullet:

           - item
           * item
           + item
        */

        const bullet =
            line.match(
                /^\s*[-*+]\s+(.+)$/
            );


        /*
           Number:

           1. item
           2. item
        */

        const number =
            line.match(
                /^\s*\d+\.\s+(.+)$/
            );


        if (bullet) {

            if (inOL) {

                result.push("</ol>");

                inOL = false;

            }

            if (!inUL) {

                result.push("<ul>");

                inUL = true;

            }

            result.push(
                "<li>" +
                bullet[1] +
                "</li>"
            );

            return;

        }


        if (number) {

            if (inUL) {

                result.push("</ul>");

                inUL = false;

            }

            if (!inOL) {

                result.push("<ol>");

                inOL = true;

            }

            result.push(
                "<li>" +
                number[1] +
                "</li>"
            );

            return;

        }


        closeLists();

        result.push(line);

    });


    closeLists();


    return result.join("\n");

}


/* ================= COPY BUTTONS ================= */

function addCopyButtons() {

    const buttons =
        document.querySelectorAll(
            ".copy-code"
        );


    buttons.forEach(function(button) {

        if (
            button.dataset.ready
        ) {
            return;
        }


        button.dataset.ready = "true";


        button.addEventListener(
            "click",
            async function() {

                const code =
                    decodeURIComponent(
                        button.dataset.code
                    );


                try {

                    await navigator.clipboard.writeText(
                        code
                    );

                    button.textContent =
                        "Copied!";


                    setTimeout(
                        function() {

                            button.textContent =
                                "Copy";

                        },
                        1200
                    );

                } catch (error) {

                    button.textContent =
                        "Failed";

                }

            }
        );

    });

}


/* ================= SCROLL ================= */

function scrollBottom() {

    const chat =
        document.getElementById("chat");

    chat.scrollTo({

        top:
            chat.scrollHeight,

        behavior:
            "smooth"

    });

}


/* ================= NEW CHAT ================= */

function newChat() {

    messages.innerHTML = `

        <div
            class="welcome"
            id="welcome">

            <h1>
                What can I help with?
            </h1>

            <p>
                Ask anything. Build anything.
                Explore anything.
            </p>

        </div>

    `;

}


/* ================= ESCAPE ================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}

</script>
