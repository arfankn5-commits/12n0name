<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>12n0name AI</title>

<style>

/* =========================================================
   THEME
========================================================= */

:root {
    --bg: #0b0d10;
    --sidebar: #111318;
    --surface: #171a20;
    --surface-2: #1d2129;
    --hover: #252a33;
    --border: #2b3039;

    --text: #f1f3f5;
    --secondary: #9aa1ac;
    --muted: #737b87;

    --accent: #ffffff;
    --accent-text: #0b0d10;

    --danger: #ff6b6b;
    --success: #52d273;

    --code-bg: #090b0e;
    --table-header: #20242c;
}

body.light {
    --bg: #f5f6f8;
    --sidebar: #ffffff;
    --surface: #ffffff;
    --surface-2: #eef0f3;
    --hover: #e4e7eb;
    --border: #d5d9df;

    --text: #17191d;
    --secondary: #606772;
    --muted: #858b95;

    --accent: #17191d;
    --accent-text: #ffffff;

    --code-bg: #f0f1f3;
    --table-header: #e5e7eb;
}

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: var(--bg);
    color: var(--text);

    overflow: hidden;
}

button,
textarea {
    font-family: inherit;
}

/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    position: fixed;

    left: 0;
    top: 0;
    bottom: 0;

    width: 280px;

    background: var(--sidebar);
    border-right: 1px solid var(--border);

    padding: 16px;

    z-index: 3000;

    display: none;

    box-shadow: 8px 0 30px rgba(0, 0, 0, 0.25);
}

.sidebar.open {
    display: block;
}

.sidebar-header {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;

    margin-bottom: 24px;
}

.logo {
    display: flex;
    align-items: center;

    gap: 10px;

    min-width: 0;
}

.logo-icon {
    width: 38px;
    height: 38px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background: var(--accent);
    color: var(--accent-text);

    font-size: 14px;
    font-weight: 800;
}

.logo span {
    font-size: 17px;
    font-weight: 700;
    white-space: nowrap;
}

/* =========================================================
   SIDEBAR CLOSE BUTTON
========================================================= */

.sidebar-close {
    width: 40px;
    height: 40px;

    flex-shrink: 0;

    display: flex !important;
    align-items: center;
    justify-content: center;

    border: 1px solid var(--border);
    border-radius: 10px;

    background: var(--surface);
    color: var(--text);

    font-size: 28px;
    font-weight: 400;

    line-height: 1;

    cursor: pointer;

    padding: 0;

    visibility: visible !important;
    opacity: 1 !important;
}

.sidebar-close:hover {
    background: var(--hover);
    border-color: var(--text);
}

.sidebar-close:active {
    transform: scale(0.92);
}

/* =========================================================
   NEW CHAT
========================================================= */

.new-chat {
    width: 100%;

    padding: 12px 14px;

    border: 1px solid var(--border);
    border-radius: 10px;

    background: var(--surface);
    color: var(--text);

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;
}

.new-chat:hover {
    background: var(--hover);
}

/* =========================================================
   OVERLAY
========================================================= */

.sidebar-overlay {
    position: fixed;
    inset: 0;

    background: rgba(0, 0, 0, 0.45);

    z-index: 2500;

    display: none;
}

.sidebar-overlay.show {
    display: block;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    height: 62px;

    flex-shrink: 0;

    display: flex;
    align-items: center;

    gap: 14px;

    padding: 0 16px;

    border-bottom: 1px solid var(--border);

    background: var(--bg);
}

.menu-button,
.theme-button {
    width: 40px;
    height: 40px;

    border: 1px solid var(--border);
    border-radius: 10px;

    background: var(--surface);
    color: var(--text);

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;
}

.menu-button:hover,
.theme-button:hover {
    background: var(--hover);
}

.model {
    font-size: 16px;
    font-weight: 700;
}

.model span {
    opacity: 0.55;
    font-weight: 500;
}

.status {
    margin-left: auto;

    display: flex;
    align-items: center;

    gap: 7px;

    color: var(--secondary);

    font-size: 13px;
}

.status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: var(--success);
}

/* =========================================================
   CHAT
========================================================= */

.chat {
    flex: 1;
    min-height: 0;

    display: flex;
    justify-content: center;

    overflow: hidden;
}

.messages {
    width: 100%;
    max-width: 900px;

    padding: 28px 18px 160px;

    overflow-y: auto;
    overflow-x: hidden;

    scroll-behavior: smooth;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome {
    min-height: 60vh;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}

.welcome h1 {

    letter-spacing: -1.5px;
}

.welcome p {
    margin: 0;

    font-size: 15px;
}

/* =========================================================
   MESSAGES
========================================================= */

.message {
    display: flex;

    margin-bottom: 24px;
}

.message.user {
    justify-content: flex-end;
}

.message.ai {
    justify-content: flex-start;
}

.bubble {
    max-width: 90%;

    font-size: 15px;
    line-height: 1.65;

    overflow-wrap: anywhere;
}

.user .bubble {
    max-width: 85%;

    padding: 13px 16px;

    border-radius: 15px;

    background: var(--surface-2);
    border: 1px solid var(--border);

    white-space: pre-wrap;
}

.ai .bubble {
    padding: 0;
}

/* =========================================================
   MARKDOWN HEADINGS
========================================================= */

.md-heading {
    margin: 25px 0 10px;

    line-height: 1.3;

    letter-spacing: -0.4px;
}

.md-heading:first-child {
    margin-top: 0;
}

.md-h1 {
    font-size: 28px;
}

.md-h2 {
    font-size: 24px;
}

.md-h3 {
    font-size: 20px;
}

.md-h4 {
    font-size: 17px;
}

/* =========================================================
   PARAGRAPHS
========================================================= */

.md-paragraph {
    margin: 0 0 14px;
}

.md-paragraph:last-child {
    margin-bottom: 0;
}

/* =========================================================
   INLINE MARKDOWN
========================================================= */

.md-inline-code {
    display: inline;

    padding: 2px 6px;

    border: 1px solid var(--border);
    border-radius: 6px;

    background: var(--code-bg);

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 0.9em;
}

.md-link {
    color: #62a8ff;

    text-decoration: underline;

    text-underline-offset: 2px;
}

.md-link:hover {
    opacity: 0.8;
}

/* =========================================================
   LISTS
========================================================= */

.md-list {
    margin: 8px 0 16px;

    padding-left: 28px;
}

.md-list li {
    margin: 5px 0;
}

/* =========================================================
   BLOCKQUOTE
========================================================= */

.md-blockquote {
    margin: 14px 0;

    padding: 9px 14px;

    border-left: 3px solid var(--secondary);

    background: var(--surface);

    color: var(--secondary);
}

/* =========================================================
   HORIZONTAL RULE
========================================================= */

.md-hr {
    margin: 22px 0;

    border: 0;

    border-top: 1px solid var(--border);
}

/* =========================================================
   CODE
========================================================= */

.code-wrapper {
    margin: 16px 0;

    border: 1px solid var(--border);
    border-radius: 12px;

    overflow: hidden;

    background: var(--code-bg);
}

.code-header {
    min-height: 38px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 7px 10px;

    border-bottom: 1px solid var(--border);

    color: var(--secondary);

    font-size: 12px;
}

.code-language {
    font-family:
        Consolas,
        "Courier New",
        monospace;
}

.copy-code {
    padding: 5px 10px;

    border: 1px solid var(--border);
    border-radius: 7px;

    background: var(--surface);
    color: var(--text);

    font-size: 12px;

    cursor: pointer;
}

.copy-code:hover {
    background: var(--hover);
}

.code-wrapper pre {
    margin: 0;

    padding: 15px;

    overflow-x: auto;

    white-space: pre;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 13px;

    line-height: 1.55;
}

.code-wrapper code {
    font-family: inherit;
}

/* =========================================================
   TABLE
========================================================= */

.table-wrapper {
    width: 100%;

    margin: 16px 0;

    overflow-x: auto;

    border: 1px solid var(--border);
    border-radius: 10px;
}

.md-table {
    width: 100%;

    min-width: 500px;

    border-collapse: collapse;

    font-size: 14px;
}

.md-table th,
.md-table td {
    padding: 9px 12px;

    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);

    text-align: left;
    vertical-align: top;
}

.md-table th {
    background: var(--table-header);

    font-weight: 700;
}

.md-table tr:last-child td {
    border-bottom: 0;
}

.md-table th:last-child,
.md-table td:last-child {
    border-right: 0;
}

/* =========================================================
   GENERATING
========================================================= */

.generating {
    display: inline-flex;

    align-items: center;

    gap: 5px;
}

.generating span {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--secondary);

    animation: typing 1.2s infinite ease-in-out;
}

.generating span:nth-child(2) {
    animation-delay: 0.15s;
}

.generating span:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes typing {

    0%,
    60%,
    100% {
        transform: translateY(0);
        opacity: 0.4;
    }

    30% {
        transform: translateY(-4px);
        opacity: 1;
    }
}

/* =========================================================
   ERRORS
========================================================= */

.error {
    color: var(--danger);
}

.error-title {
    font-weight: 700;
    margin-bottom: 7px;
}

.error-detail {
    color: var(--secondary);

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 12px;

    word-break: break-word;
}

/* =========================================================
   INPUT
========================================================= */

.input-area {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    display: flex;
    justify-content: center;

    padding: 12px 16px 15px;

    background:
        linear-gradient(
            to top,
            var(--bg) 70%,
            transparent
        );

    z-index: 100;
}

.input-container {
    width: 100%;
    max-width: 900px;

    position: relative;

    display: flex;
    align-items: flex-end;

    gap: 8px;

    padding: 8px;

    border: 1px solid var(--border);
    border-radius: 15px;

    background: var(--surface);

    box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.2);
}

#prompt {
    flex: 1;

    min-height: 42px;
    max-height: 180px;

    resize: none;

    border: 0;
    outline: 0;

    background: transparent;

    color: var(--text);

    font-size: 15px;

    line-height: 1.5;

    padding: 10px 8px;
}

#prompt::placeholder {
    color: var(--muted);
}

.send-button,
.stop-button {
    width: 42px;
    height: 42px;

    flex-shrink: 0;

    border: 0;
    border-radius: 11px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 18px;
}

.send-button {
    background: var(--accent);
    color: var(--accent-text);
}

.send-button:hover {
    opacity: 0.85;
}

.stop-button {
    display: none;

    background: var(--danger);
    color: white;
}

.stop-button.show {
    display: flex;
}

.footer {
    position: absolute;

    bottom: -21px;

    left: 0;
    right: 0;

    text-align: center;

    color: var(--muted);

    font-size: 10px;
}

/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {
    width: 7px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: var(--border);

    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: var(--secondary);
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .sidebar {
        width: 285px;
    }

    .bubble {
        max-width: 96%;
    }

    .messages {
        padding-left: 12px;
        padding-right: 12px;
    }

    .topbar {
        padding: 0 10px;
    }

    .status {
        display: none;
    }

    .welcome h1 {
        font-size: 32px;
    }

    .input-area {
        padding-left: 8px;
        padding-right: 8px;
    }

}

</style>

</head>

<div class="app">

<!-- =====================================================

<aside

<header class="topbar">

    </button>

    </div>

<section class="chat">

<script>

/* =========================================================
   API
========================================================= */

const API_URL =
    "https://desktop-3fdvn7b.tail77d397.ts.net/v1/chat/completions";


/* =========================================================
   STATE
========================================================= */

let conversation = [];

let controller = null;

let generating = false;


/* =========================================================
   ELEMENTS
========================================================= */

const sidebar =
    document.getElementById("sidebar");

const sidebarOverlay =
    document.getElementById("sidebarOverlay");

const messages =
    document.getElementById("messages");

const prompt =
    document.getElementById("prompt");

const sendButton =
    document.getElementById("sendButton");

const stopButton =
    document.getElementById("stopButton");

const themeButton =
    document.getElementById("themeButton");


/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar() {

    const open =
        sidebar.classList.toggle("open");

    sidebarOverlay.classList.toggle(
        "show",
        open
    );
}

function closeSidebar() {

    sidebar.classList.remove("open");

    sidebarOverlay.classList.remove("show");
}


/* =========================================================
   THEME
========================================================= */

function toggleTheme() {

    document.body.classList.toggle("light");

    const light =
        document.body.classList.contains("light");

    themeButton.textContent =
        light ? "☀️" : "🌙";

    localStorage.setItem(
        "12n0name-theme",
        light ? "light" : "dark"
    );
}


(function loadTheme() {

    if (
        localStorage.getItem(
            "12n0name-theme"
        ) === "light"
    ) {

        document.body.classList.add("light");

        themeButton.textContent = "☀️";
    }

})();


/* =========================================================
   NEW CHAT
========================================================= */

function newChat() {

    conversation = [];

    messages.innerHTML = `
        <div class="welcome" id="welcome">
            <h1>What can I help with?</h1>
            <p>Ask anything. Build anything. Explore anything.</p>
        </div>
    `;

    prompt.value = "";

    autoResize();

    closeSidebar();

    prompt.focus();
}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   MARKDOWN ESCAPES
========================================================= */

function unescapeMarkdown(text) {

    return text.replace(
        /\\([\\`*_[\]{}()#+\-.!|>])/g,
        "$1"
    );
}


/* =========================================================
   INLINE MARKDOWN
========================================================= */

function inlineMarkdown(text) {

    const inlineCodes = [];


    /*
       Protect inline code.
    */

    text = text.replace(
        /`([^`\n]+)`/g,
        function (_, code) {

            const id =
                inlineCodes.length;

            inlineCodes.push(
                `<code class="md-inline-code">${escapeHTML(code)}</code>`
            );

            return `@@INLINECODE${id}@@`;
        }
    );


    /*
       Remove Markdown escaping.
    */

    text =
        unescapeMarkdown(text);


    /*
       Escape HTML.
    */

    text =
        escapeHTML(text);


    /*
       Links.
    */

    text = text.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        function (_, label, url) {

            return `
                <a
                    class="md-link"
                    href="${url}"
                    target="_blank"
                    rel="noopener noreferrer">
                    ${label}
                </a>
            `;
        }
    );


    /*
       Bold.
    */

    text = text.replace(
        /\*\*(.+?)\*\*/g,
        "<strong>$1</strong>"
    );

    text = text.replace(
        /__(.+?)__/g,
        "<strong>$1</strong>"
    );


    /*
       Italic.
    */

    text = text.replace(
        /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
        "<em>$1</em>"
    );

    text = text.replace(
        /(?<!\w)_([^_\n]+)_(?!\w)/g,
        "<em>$1</em>"
    );


    /*
       Restore inline code.
    */

    text = text.replace(
        /@@INLINECODE(\d+)@@/g,
        function (_, id) {

            return inlineCodes[
                Number(id)
            ];
        }
    );


    return text;
}


/* =========================================================
   TABLE
========================================================= */

function isTableSeparator(line) {

    const cells =
        line.trim()
            .replace(/^\|/, "")
            .replace(/\|$/, "")
            .split("|");


    if (!cells.length) {
        return false;
    }


    return cells.every(
        cell =>
            /^ *:?-{3,}:? *$/.test(
                cell
            )
    );
}


function parseTable(lines) {

    if (lines.length < 2) {
        return null;
    }


    if (
        !isTableSeparator(
            lines[1]
        )
    ) {
        return null;
    }


    function splitRow(line) {

        return line
            .trim()
            .replace(/^\|/, "")
            .replace(/\|$/, "")
            .split("|")
            .map(
                cell =>
                    cell.trim()
            );
    }


    const headers =
        splitRow(lines[0]);


    const alignments =
        splitRow(lines[1])
            .map(cell => {

                const left =
                    cell.startsWith(":");

                const right =
                    cell.endsWith(":");


                if (
                    left &&
                    right
                ) {
                    return "center";
                }


                if (right) {
                    return "right";
                }


                return "left";
            });


    let html = `
        <div class="table-wrapper">
        <table class="md-table">

        <thead>
        <tr>
    `;


    headers.forEach(
        (header, index) => {

            const align =
                alignments[index] ||
                "left";


            html += `
                <th style="text-align:${align}">
                    ${inlineMarkdown(header)}
                </th>
            `;
        }
    );


    html += `
        </tr>
        </thead>
        <tbody>
    `;


    for (
        let i = 2;
        i < lines.length;
        i++
    ) {

        const cells =
            splitRow(lines[i]);


        html += "<tr>";


        for (
            let j = 0;
            j < headers.length;
            j++
        ) {

            const value =
                cells[j] ?? "";


            const align =
                alignments[j] ||
                "left";


            html += `
                <td style="text-align:${align}">
                    ${inlineMarkdown(value)}
                </td>
            `;
        }


        html += "</tr>";
    }


    html += `
        </tbody>
        </table>
        </div>
    `;


    return html;
}


/* =========================================================
   CODE BLOCK
========================================================= */

function createCodeBlock(
    language,
    code
) {

    return `
        <div class="code-wrapper">

            <div class="code-header">

                <span class="code-language">
                    ${escapeHTML(
                        language || "code"
                    )}
                </span>

                <button
                    class="copy-code"
                    type="button"
                    onclick="copyCode(this)">
                    Copy
                </button>

            </div>

            <pre><code>${escapeHTML(
                code
            )}</code></pre>

        </div>
    `;
}


/* =========================================================
   MARKDOWN PARSER
========================================================= */

function formatResponse(rawText) {

    if (
        rawText === null ||
        rawText === undefined
    ) {
        return "";
    }


    let text =
        String(rawText)
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n");


    const lines =
        text.split("\n");


    const output = [];

    let i = 0;


    while (i < lines.length) {

        const line =
            lines[i];


        /* EMPTY */

        if (!line.trim()) {

            i++;

            continue;
        }


        /* =================================================
           CODE BLOCK
        ================================================= */

        if (
            line.trim().startsWith("```")
        ) {

            const language =
                line.trim()
                    .slice(3)
                    .trim() ||
                "code";


            const codeLines = [];

            i++;


            while (
                i < lines.length &&
                !lines[i]
                    .trim()
                    .startsWith("```")
            ) {

                codeLines.push(
                    lines[i]
                );

                i++;
            }


            if (
                i < lines.length
            ) {
                i++;
            }


            output.push(
                createCodeBlock(
                    language,
                    codeLines.join("\n")
                )
            );


            continue;
        }


        /* =================================================
           HEADINGS
        ================================================= */

        const heading =
            line.match(
                /^(#{1,6})[ \t]+(.+?)\s*$/
            );


        if (heading) {

            const level =
                Math.min(
                    heading[1].length,
                    4
                );


            output.push(
                `
                <h${level}
                    class="md-heading md-h${level}">
                    ${inlineMarkdown(
                        heading[2]
                    )}
                </h${level}>
                `
            );


            i++;

            continue;
        }


        /* =================================================
           HORIZONTAL RULE
        ================================================= */

        if (
            /^ {0,3}([-*_])(?:\s*\1){2,}\s*$/
                .test(line)
        ) {

            output.push(
                '<hr class="md-hr">'
            );

            i++;

            continue;
        }


        /* =================================================
           BLOCKQUOTE
        ================================================= */

        if (
            /^>\s?/.test(line)
        ) {

            const quoteLines = [];


            while (
                i < lines.length &&
                /^>\s?/.test(
                    lines[i]
                )
            ) {

                quoteLines.push(
                    lines[i]
                        .replace(
                            /^>\s?/,
                            ""
                        )
                );

                i++;
            }


            output.push(
                `
                <blockquote
                    class="md-blockquote">
                    ${quoteLines
                        .map(
                            inlineMarkdown
                        )
                        .join("<br>")}
                </blockquote>
                `
            );


            continue;
        }


        /* =================================================
           TABLE
        ================================================= */

        if (
            i + 1 < lines.length &&
            lines[i].includes("|") &&
            isTableSeparator(
                lines[i + 1]
            )
        ) {

            const tableLines = [
                lines[i],
                lines[i + 1]
            ];


            i += 2;


            while (
                i < lines.length &&
                lines[i].trim() &&
                lines[i].includes("|")
            ) {

                tableLines.push(
                    lines[i]
                );

                i++;
            }


            const table =
                parseTable(
                    tableLines
                );


            if (table) {

                output.push(table);

                continue;
            }
        }


        /* =================================================
           BULLET LIST
        ================================================= */

        if (
            /^\s*[-*+]\s+/.test(line)
        ) {

            const items = [];


            while (
                i < lines.length &&
                /^\s*[-*+]\s+/.test(
                    lines[i]
                )
            ) {

                items.push(
                    lines[i]
                        .replace(
                            /^\s*[-*+]\s+/,
                            ""
                        )
                );

                i++;
            }


            output.push(
                `
                <ul class="md-list">
                    ${items
                        .map(
                            item =>
                            `<li>${inlineMarkdown(item)}</li>`
                        )
                        .join("")}
                </ul>
                `
            );


            continue;
        }


        /* =================================================
           NUMBERED LIST
        ================================================= */

        if (
            /^\s*\d+[.)]\s+/.test(line)
        ) {

            const items = [];


            while (
                i < lines.length &&
                /^\s*\d+[.)]\s+/.test(
                    lines[i]
                )
            ) {

                items.push(
                    lines[i]
                        .replace(
                            /^\s*\d+[.)]\s+/,
                            ""
                        )
                );

                i++;
            }


            output.push(
                `
                <ol class="md-list">
                    ${items
                        .map(
                            item =>
                            `<li>${inlineMarkdown(item)}</li>`
                        )
                        .join("")}
                </ol>
                `
            );


            continue;
        }


        /* =================================================
           NORMAL PARAGRAPH
        ================================================= */

        const paragraph = [
            line
        ];


        i++;


        while (
            i < lines.length
        ) {

            const next =
                lines[i];


            if (!next.trim()) {
                break;
            }


            if (
                next.trim()
                    .startsWith("```")
            ) {
                break;
            }


            if (
                /^(#{1,6})[ \t]+/.test(
                    next
                )
            ) {
                break;
            }


            if (
                /^>\s?/.test(next)
            ) {
                break;
            }


            if (
                /^\s*[-*+]\s+/.test(
                    next
                )
            ) {
                break;
            }


            if (
                /^\s*\d+[.)]\s+/.test(
                    next
                )
            ) {
                break;
            }


            paragraph.push(
                next
            );

            i++;
        }


        output.push(
            `
            <p class="md-paragraph">
                ${paragraph
                    .map(
                        inlineMarkdown
                    )
                    .join("<br>")}
            </p>
            `
        );
    }


    return output.join("");
}


/* =========================================================
   COPY CODE
========================================================= */

async function copyCode(button) {

    const wrapper =
        button.closest(
            ".code-wrapper"
        );


    const code =
        wrapper?.querySelector(
            "code"
        );


    if (!code) {
        return;
    }


    try {

        await navigator.clipboard.writeText(
            code.textContent
        );


        const old =
            button.textContent;


        button.textContent =
            "Copied!";


        setTimeout(
            () => {
                button.textContent =
                    old;
            },
            1200
        );


    } catch (error) {

        button.textContent =
            "Failed";


        setTimeout(
            () => {
                button.textContent =
                    "Copy";
            },
            1200
        );
    }
}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    role,
    content
) {

    const welcome =
        document.getElementById(
            "welcome"
        );


    if (welcome) {
        welcome.remove();
    }


    const message =
        document.createElement(
            "div"
        );


    message.className =
        `message ${role}`;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    if (role === "user") {

        bubble.textContent =
            content;

    } else {

        bubble.innerHTML =
            content;
    }


    message.appendChild(
        bubble
    );


    messages.appendChild(
        message
    );


    scrollToBottom();


    return message;
}


/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom() {

    requestAnimationFrame(
        () => {

            messages.scrollTop =
                messages.scrollHeight;
        }
    );
}


/* =========================================================
   GENERATING
========================================================= */

function createGeneratingMessage() {

    return addMessage(
        "ai",
        `
        <div class="generating">
            <span></span>
            <span></span>
            <span></span>
        </div>
        `
    );
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    if (generating) {
        return;
    }


    const text =
        prompt.value.trim();


    if (!text) {
        return;
    }


    addMessage(
        "user",
        text
    );


    conversation.push({
        role: "user",
        content: text
    });


    prompt.value = "";

    autoResize();


    const aiMessage =
        createGeneratingMessage();


    generating = true;


    controller =
        new AbortController();


    sendButton.style.display =
        "none";


    stopButton.classList.add(
        "show"
    );


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body: JSON.stringify({

                        messages:
                            conversation,

                        temperature:
                            0.7,

                        max_tokens:
                            1024,

                        stream:
                            false

                    }),

                    signal:
                        controller.signal
                }
            );


        if (!response.ok) {

            let serverText = "";

            try {
                serverText =
                    await response.text();
            } catch (_) {
                serverText = "";
            }


            throw new Error(
                `HTTP ${response.status}` +
                (
                    serverText
                        ? ` — ${serverText.slice(0, 300)}`
                        : ""
                )
            );
        }


        const data =
            await response.json();


        const choice =
            data?.choices?.[0];


        let reply =
            choice?.message?.content ??
            choice?.text ??
            "";


        if (Array.isArray(reply)) {

            reply =
                reply
                    .map(item => {

                        if (
                            typeof item ===
                            "string"
                        ) {
                            return item;
                        }

                        return (
                            item?.text ||
                            item?.content ||
                            ""
                        );
                    })
                    .join("");
        }


        reply =
            String(reply);


        if (!reply.trim()) {

            throw new Error(
                "The server returned an empty response."
            );
        }


        aiMessage
            .querySelector(
                ".bubble"
            )
            .innerHTML =
            formatResponse(
                reply
            );


        conversation.push({
            role: "assistant",
            content: reply
        });


        scrollToBottom();


    } catch (error) {

        console.error(
            "12n0name AI API error:",
            error
        );


        if (
            error.name ===
            "AbortError"
        ) {

            aiMessage.remove();

        } else {

            let message =
                error?.message ||
                "Unknown connection error.";


            /*
               Special browser network error.
            */

            if (
                error instanceof TypeError
            ) {

                message =
                    "The browser could not reach the AI server. " +
                    "Check your Tailscale connection, llama.cpp server, " +
                    "HTTPS endpoint, and CORS configuration.";
            }


            aiMessage
                .querySelector(
                    ".bubble"
                )
                .innerHTML = `
                    <div class="error">

                        <div class="error-title">
                            ⚠️ Connection failed
                        </div>

                        <div class="error-detail">
                            ${escapeHTML(message)}
                        </div>

                        <br>

                        <div>
                            If the problem continues,
                            contact on
                            <strong>
                                arfankn@gmail.com
                            </strong>
                        </div>

                    </div>
                `;
        }

    } finally {

        generating = false;

        controller = null;


        sendButton.style.display =
            "flex";


        stopButton.classList.remove(
            "show"
        );


        prompt.focus();
    }
}


/* =========================================================
   STOP
========================================================= */

function stopGeneration() {

    if (controller) {

        controller.abort();

        controller = null;
    }


    generating = false;


    sendButton.style.display =
        "flex";


    stopButton.classList.remove(
        "show"
    );
}


/* =========================================================
   TEXTAREA RESIZE
========================================================= */

function autoResize() {

    prompt.style.height =
        "auto";


    prompt.style.height =
        Math.min(
            prompt.scrollHeight,
            180
        ) + "px";
}


prompt.addEventListener(
    "input",
    autoResize
);


/* =========================================================
   ENTER
========================================================= */

prompt.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeSidebar();
        }
    }
);


/* =========================================================
   START
========================================================= */

prompt.focus();

</script>
