<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>12n0name AI</title>

<!-- Browser tab logo -->
<link rel="icon" type="image/png" href="logo.png">

<style>
:root {
    --bg:#0b0d10;
    --sidebar:#111318;
    --surface:#171a20;
    --hover:#22262e;
    --border:#292d35;
    --text:#ffffff;
    --secondary:#969ca8;
    --muted:#646a75;
    --user:#252a33;
    --cyan:#00e5ff;
    --purple:#7c4dff;
}

body.light {
    --bg:#f5f6f8;
    --sidebar:#ffffff;
    --surface:#ffffff;
    --hover:#e9ebef;
    --border:#d8dbe1;
    --text:#111318;
    --secondary:#555b66;
    --muted:#777d87;
    --user:#e9ebef;
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html, body {
    width:100%;
    height:100%;
}

body {
    background:var(--bg);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
}

/* ================= SIDEBAR ================= */

.sidebar {
    position:fixed;
    left:-270px;
    top:0;
    width:270px;
    height:100%;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    z-index:1000;
    transition:left .15s ease;
    padding:18px;
}

.sidebar.open {
    left:0;
}

.sidebar-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:25px;
}

.logo {
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:bold;
}

.logo-box {
    width:35px;
    height:35px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,var(--cyan),var(--purple));
    color:white;
    font-weight:bold;
}

.close-sidebar {
    border:0;
    background:none;
    color:var(--secondary);
    font-size:25px;
    cursor:pointer;
}

.close-sidebar:hover {
    color:var(--text);
}

.new-chat {
    width:100%;
    padding:13px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface);
    color:var(--text);
    cursor:pointer;
    text-align:left;
    font-size:15px;
}

.new-chat:hover {
    background:var(--hover);
}

/* ================= TOPBAR ================= */

.topbar {
    height:60px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:var(--bg);
}

.top-left {
    display:flex;
    align-items:center;
    gap:14px;
}

.menu-btn,
.theme-btn {
    width:38px;
    height:38px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:var(--text);
    cursor:pointer;
    font-size:20px;
}

.menu-btn:hover,
.theme-btn:hover {
    background:var(--hover);
}

.title {
    font-size:17px;
    font-weight:bold;
}

/* ================= CHAT ================= */

.main {
    height:calc(100% - 60px);
    display:flex;
    flex-direction:column;
}

.chat {
    flex:1;
    overflow-y:auto;
    padding:30px 15px 150px;
}

.chat-inner {
    max-width:850px;
    margin:auto;
}

/* ================= WELCOME ================= */

.welcome {
    min-height:65vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.welcome h1 {
    font-size:34px;
    margin-bottom:12px;
}

.welcome p {
    color:var(--secondary);
    font-size:16px;
}

/* ================= MESSAGES ================= */

.message {
    display:flex;
    gap:12px;
    margin:22px 0;
    line-height:1.6;
}

.avatar {
    min-width:34px;
    width:34px;
    height:34px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:bold;
    background:linear-gradient(135deg,var(--cyan),var(--purple));
    color:white;
}

.message.user .avatar {
    background:var(--user);
    color:var(--text);
}

.message-content {
    max-width:calc(100% - 50px);
    white-space:pre-wrap;
    word-break:break-word;
}

.message.user .message-content {
    background:var(--user);
    padding:10px 14px;
    border-radius:14px;
}

/* ================= INPUT ================= */

.input-area {
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    padding:18px;
    background:linear-gradient(
        transparent,
        var(--bg) 25%
    );
}

.input-box {
    max-width:850px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:8px;
}

textarea {
    flex:1;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:var(--text);
    padding:10px;
    font-family:inherit;
    font-size:15px;
    min-height:42px;
    max-height:150px;
}

textarea::placeholder {
    color:var(--muted);
}

.send-btn {
    width:42px;
    height:42px;
    border:0;
    border-radius:11px;
    background:var(--cyan);
    color:#000;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
}

.send-btn:hover {
    opacity:.85;
}

.send-btn.stop {
    background:#ff4444;
    color:white;
}

/* ================= FOOTER ================= */

.footer {
    text-align:center;
    color:var(--muted);
    font-size:11px;
    margin-top:8px;
}

/* ================= THINKING ================= */

.thinking {
    display:flex;
    align-items:center;
    gap:5px;
    color:var(--secondary);
}

.dot {
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--secondary);
    animation:blink 1.2s infinite;
}

.dot:nth-child(2) {
    animation-delay:.2s;
}

.dot:nth-child(3) {
    animation-delay:.4s;
}

@keyframes blink {
    0%,80%,100% {
        opacity:.25;
    }

    40% {
        opacity:1;
    }
}

/* ================= MOBILE ================= */

@media(max-width:700px) {

    .sidebar {
        width:270px;
    }

    .welcome h1 {
        font-size:27px;
    }

    .welcome p {
        font-size:14px;
    }

    .chat {
        padding-left:10px;
        padding-right:10px;
    }

    .input-area {
        padding:10px;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

    <div class="sidebar-header">

        <div class="logo">
            <div class="logo-box">12</div>
            <span>12n0name</span>
        </div>

        <button class="close-sidebar" onclick="toggleSidebar()">
            ×
        </button>

    </div>

    <button class="new-chat" onclick="newChat()">
        ＋ New chat
    </button>

</div>


<!-- TOPBAR -->
<div class="topbar">

    <div class="top-left">

        <button class="menu-btn" onclick="toggleSidebar()">
            ☰
        </button>

        <div class="title">
            12n0name AI
        </div>

    </div>

    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">
        🌙
    </button>

</div>


<!-- MAIN -->
<div class="main">

    <div class="chat" id="chat">

        <div class="chat-inner" id="chatInner">

            <div class="welcome" id="welcome">

                <h1>What can I help with?</h1>

                <p>
                    Ask anything. Build anything. Explore anything.
                </p>

            </div>

        </div>

    </div>


    <!-- INPUT -->
    <div class="input-area">

        <div class="input-box">

            <textarea
                id="input"
                placeholder="Ask 12n0name..."
                rows="1"
            ></textarea>

            <button
                class="send-btn"
                id="sendBtn"
                onclick="sendMessage()"
            >
                ↑
            </button>

        </div>

        <div class="footer">
            12n0name AI can make mistakes. Check important information.
        </div>

    </div>

</div>


<script>

/* =====================================================
   API
   ===================================================== */

/*
   IMPORTANT:
   This must point to the llama.cpp OpenAI-compatible
   chat endpoint, NOT just the Cloudflare domain.
*/

const API_URL =
"https://consist-significantly-definitions-counts.trycloudflare.com/v1/chat/completions";


/* =====================================================
   STATE
   ===================================================== */

let conversation = [];

let controller = null;

let generating = false;


/* =====================================================
   SIDEBAR
   ===================================================== */

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList.toggle("open");

}


/* =====================================================
   THEME
   ===================================================== */

function loadTheme() {

    const theme = localStorage.getItem("12n0name-theme");

    if (theme === "light") {

        document.body.classList.add("light");

        document.getElementById("themeBtn").textContent = "☀️";

    } else {

        document.body.classList.remove("light");

        document.getElementById("themeBtn").textContent = "🌙";

    }

}


function toggleTheme() {

    document.body.classList.toggle("light");

    const light =
        document.body.classList.contains("light");

    localStorage.setItem(
        "12n0name-theme",
        light ? "light" : "dark"
    );

    document.getElementById("themeBtn").textContent =
        light ? "☀️" : "🌙";

}


loadTheme();


/* =====================================================
   NEW CHAT
   ===================================================== */

function newChat() {

    conversation = [];

    document.getElementById("chatInner").innerHTML = `

        <div class="welcome" id="welcome">

            <h1>What can I help with?</h1>

            <p>
                Ask anything. Build anything. Explore anything.
            </p>

        </div>
    `;

    document.getElementById("input").value = "";

    document
        .getElementById("sidebar")
        .classList.remove("open");

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {

    if (value === null || value === undefined) {
        return "";
    }

    if (typeof value !== "string") {
        value = String(value);
    }

    return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   CONTENT EXTRACTION
   ===================================================== */

function getTextContent(content) {

    if (typeof content === "string") {
        return content;
    }

    if (Array.isArray(content)) {

        return content.map(part => {

            if (typeof part === "string") {
                return part;
            }

            if (part && typeof part.text === "string") {
                return part.text;
            }

            if (part && typeof part.content === "string") {
                return part.content;
            }

            return "";

        }).join("");

    }

    if (content && typeof content.text === "string") {
        return content.text;
    }

    return String(content ?? "");

}


/* =====================================================
   FORMAT TEXT
   ===================================================== */

function formatText(text) {

    return escapeHTML(text);

}


/* =====================================================
   ADD USER MESSAGE
   ===================================================== */

function addUserMessage(text) {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const message =
        document.createElement("div");

    message.className = "message user";

    message.innerHTML = `

        <div class="avatar">
            You
        </div>

        <div class="message-content">
            ${formatText(text)}
        </div>
    `;

    document
        .getElementById("chatInner")
        .appendChild(message);

    scrollBottom();

}


/* =====================================================
   ADD AI MESSAGE
   ===================================================== */

function addAIMessage(text) {

    const message =
        document.createElement("div");

    message.className = "message ai";

    message.innerHTML = `

        <div class="avatar">
            12
        </div>

        <div class="message-content">
            ${formatText(text)}
        </div>
    `;

    document
        .getElementById("chatInner")
        .appendChild(message);

    scrollBottom();

}


/* =====================================================
   THINKING
   ===================================================== */

function addThinking() {

    const message =
        document.createElement("div");

    message.className = "message";

    message.id = "thinking";

    message.innerHTML = `

        <div class="avatar">
            12
        </div>

        <div class="message-content">

            <div class="thinking">

                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>

            </div>

        </div>
    `;

    document
        .getElementById("chatInner")
        .appendChild(message);

    scrollBottom();

}


/* =====================================================
   SCROLL
   ===================================================== */

function scrollBottom() {

    const chat =
        document.getElementById("chat");

    chat.scrollTop = chat.scrollHeight;

}


/* =====================================================
   SEND MESSAGE
   ===================================================== */

async function sendMessage() {

    const input =
        document.getElementById("input");

    const sendBtn =
        document.getElementById("sendBtn");

    const text =
        input.value.trim();


    /* STOP GENERATION */

    if (generating) {

        if (controller) {
            controller.abort();
        }

        return;
    }


    if (!text) {
        return;
    }


    /* USER MESSAGE */

    addUserMessage(text);

    conversation.push({
        role:"user",
        content:text
    });

    input.value = "";

    input.style.height = "auto";


    /* GENERATING */

    generating = true;

    controller = new AbortController();

    sendBtn.classList.add("stop");

    sendBtn.textContent = "■";

    addThinking();


    try {

        console.log("Sending request to:");
        console.log(API_URL);

        console.log("Conversation:");
        console.log(conversation);


        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"application/json",
                        "Accept":"application/json"
                    },

                    body:JSON.stringify({

                        messages:conversation,

                        temperature:0.7,

                        max_tokens:1024,

                        stream:false

                    }),

                    signal:controller.signal
                }
            );


        console.log(
            "HTTP status:",
            response.status
        );


        const raw =
            await response.text();


        console.log(
            "Raw server response:",
            raw
        );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status +
                ": " +
                raw
            );

        }


        let data;

        try {

            data = JSON.parse(raw);

        } catch {

            throw new Error(
                "Server returned invalid JSON:\n" +
                raw
            );

        }


        console.log(
            "Parsed response:",
            data
        );


        const content =
            data?.choices?.[0]?.message?.content;


        const answer =
            getTextContent(content);


        if (!answer.trim()) {

            throw new Error(
                "The AI returned an empty response.\n\n" +
                JSON.stringify(data, null, 2)
            );

        }


        const thinking =
            document.getElementById("thinking");

        if (thinking) {
            thinking.remove();
        }


        addAIMessage(answer);


        conversation.push({

            role:"assistant",

            content:answer

        });


    } catch(error) {

        console.error(
            "12n0name AI ERROR:",
            error
        );


        const thinking =
            document.getElementById("thinking");

        if (thinking) {
            thinking.remove();
        }


        if (error.name === "AbortError") {

            return;

        }


        let errorText =
            "⚠️ Connection error.\n\n";


        if (error instanceof TypeError) {

            errorText +=
                "The browser could not connect to the AI server.\n\n" +
                "Possible cause: CORS or network access.\n\n" +
                "Open F12 → Console for the exact browser error.";

        } else {

            errorText +=
                error.message;

        }


        addAIMessage(errorText);

    } finally {

        generating = false;

        controller = null;

        sendBtn.classList.remove("stop");

        sendBtn.textContent = "↑";

    }

}


/* =====================================================
   ENTER TO SEND
   ===================================================== */

document
    .getElementById("input")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* =====================================================
   AUTO RESIZE TEXTAREA
   ===================================================== */

document
    .getElementById("input")
    .addEventListener(
        "input",
        function() {

            this.style.height = "auto";

            this.style.height =
                Math.min(
                    this.scrollHeight,
                    150
                ) + "px";

        }
    );

</script>

</body>
</html>
