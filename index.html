<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12n0name AI</title>

<style>
:root {
    --bg: #0b0b12;
    --panel: #11111b;
    --panel2: #181824;
    --text: #f5f5f7;
    --muted: #9999aa;
    --border: #29293a;
    --accent: #7c5cff;
    --accent2: #00d9ff;
    --stop: #ef4444;
}

body.light {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --panel2: #eeeeF4;
    --text: #17171c;
    --muted: #666675;
    --border: #ddddE6;
    --accent: #6548e8;
    --accent2: #009ec0;
    --stop: #dc2626;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}

/* SIDEBAR */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 270px;
    height: 100vh;
    background: var(--panel);
    border-right: 1px solid var(--border);
    z-index: 10;
    display: none;
    flex-direction: column;
    padding: 18px;
}

.sidebar.open {
    display: flex;
}

.sidebar-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: bold;
    font-size: 18px;
}

.logo-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    color: white;
    background: linear-gradient(135deg, #00d9ff, #7c5cff);
    box-shadow:
        0 0 15px rgba(0, 217, 255, 0.35),
        0 0 25px rgba(124, 92, 255, 0.3);
}

.close-sidebar {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 24px;
    cursor: pointer;
}

.close-sidebar:hover {
    color: var(--text);
}

.new-chat {
    width: 100%;
    padding: 13px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
    cursor: pointer;
    font-size: 15px;
    text-align: left;
}

.new-chat:hover {
    border-color: var(--accent);
}

/* MAIN */

.main {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* TOP BAR */

.topbar {
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
}

.top-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.menu-btn,
.theme-btn {
    border: none;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-size: 22px;
}

.menu-btn:hover,
.theme-btn:hover {
    color: var(--accent2);
}

.title {
    font-size: 18px;
    font-weight: bold;
}

.title span {
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    color: transparent;
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 35px 20px 150px;
}

.chat-inner {
    width: 100%;
    max-width: 850px;
    margin: auto;
}

/* WELCOME */

.welcome {
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.welcome-logo {
    width: 70px;
    height: 70px;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 900;
    color: white;
    background: linear-gradient(135deg, #00d9ff, #7c5cff);
    box-shadow:
        0 0 25px rgba(0, 217, 255, 0.35),
        0 0 45px rgba(124, 92, 255, 0.25);
    margin-bottom: 25px;
}

.welcome h1 {
    margin: 0 0 10px;
    font-size: 34px;
}

.welcome p {
    margin: 0;
    color: var(--muted);
    font-size: 16px;
}

/* MESSAGES */

.message {
    display: flex;
    gap: 12px;
    margin: 22px 0;
    line-height: 1.6;
}

.avatar {
    min-width: 36px;
    height: 36px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: white;
    background: linear-gradient(135deg, #00d9ff, #7c5cff);
}

.user .avatar {
    background: #555568;
}

.message-content {
    padding-top: 5px;
    white-space: normal;
    overflow-wrap: anywhere;
}

/* THINKING */

.thinking {
    display: flex;
    gap: 5px;
    padding-top: 13px;
}

.thinking span {
    width: 7px;
    height: 7px;
    background: var(--muted);
    border-radius: 50%;
    animation: blink 1.2s infinite;
}

.thinking span:nth-child(2) {
    animation-delay: .2s;
}

.thinking span:nth-child(3) {
    animation-delay: .4s;
}

@keyframes blink {
    0%, 60%, 100% {
        opacity: .25;
    }
    30% {
        opacity: 1;
    }
}

/* INPUT */

.input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 15px 20px 18px;
    background: linear-gradient(
        transparent,
        var(--bg) 25%
    );
}

.input-box {
    max-width: 850px;
    margin: auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0,0,0,.2);
}

textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    min-height: 25px;
    max-height: 150px;
    padding: 8px;
}

textarea::placeholder {
    color: var(--muted);
}

.send,
.stop {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 12px;
    color: white;
    cursor: pointer;
    font-size: 18px;
    flex-shrink: 0;
}

.send {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
}

.stop {
    display: none;
    background: var(--stop);
}

.send:hover,
.stop:hover {
    transform: scale(1.04);
}

/* FOOTER */

.footer {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin-top: 8px;
}

/* MOBILE */

@media (max-width: 600px) {
    .sidebar {
        width: 85%;
        max-width: 300px;
    }

    .welcome h1 {
        font-size: 27px;
    }

    .welcome p {
        font-size: 14px;
    }

    .chat {
        padding-left: 12px;
        padding-right: 12px;
    }

    .input-area {
        padding-left: 10px;
        padding-right: 10px;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

    <div class="sidebar-top">

        <div class="brand">
            <div class="logo-icon">12</div>
            <span>12n0name</span>
        </div>

        <button
            class="close-sidebar"
            onclick="toggleSidebar()"
            title="Close"
        >×</button>

    </div>

    <button class="new-chat" onclick="newChat()">
        ＋ New chat
    </button>

</aside>


<!-- MAIN -->

<div class="main">

    <header class="topbar">

        <div class="top-left">

            <button
                class="menu-btn"
                onclick="toggleSidebar()"
                title="Menu"
            >☰</button>

            <div class="title">
                12n0name <span>AI</span>
            </div>

        </div>

        <button
            class="theme-btn"
            onclick="toggleTheme()"
            title="Toggle theme"
            id="themeButton"
        >☾</button>

    </header>


    <!-- CHAT -->

    <main class="chat" id="chat">

        <div class="chat-inner" id="chatInner">

            <section class="welcome" id="welcome">

                <div class="welcome-logo">
                    12
                </div>

                <h1>What can I help with?</h1>

                <p>
                    Ask anything. Build anything. Explore anything.
                </p>

            </section>

        </div>

    </main>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-box">

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Ask 12n0name..."
                onkeydown="handleKey(event)"
            ></textarea>

            <button
                class="send"
                id="sendButton"
                type="button"
                onclick="sendMessage()"
                title="Send"
            >➤</button>

            <button
                class="stop"
                id="stopButton"
                type="button"
                onclick="stopGenerating()"
                title="Stop generating"
            >■</button>

        </div>

        <div class="footer">
            12n0name AI can make mistakes. Check important information.
        </div>

    </div>

</div>


<script>

/* =========================
   LLAMA.CPP SERVER
========================= */

const API_URL =
    "https://enabled-plates-rating-asthma.trycloudflare.com/v1/chat/completions";


let conversation = [];
let controller = null;
let isGenerating = false;


/* =========================
   SIDEBAR
========================= */

function toggleSidebar() {

    const sidebar = document.getElementById("sidebar");

    sidebar.classList.toggle("open");
}


/* =========================
   THEME
========================= */

function toggleTheme() {

    document.body.classList.toggle("light");

    const light =
        document.body.classList.contains("light");

    localStorage.setItem("theme", light ? "light" : "dark");

    updateThemeButton();
}


function updateThemeButton() {

    const button =
        document.getElementById("themeButton");

    if (document.body.classList.contains("light")) {
        button.textContent = "☀";
    } else {
        button.textContent = "☾";
    }
}


if (localStorage.getItem("theme") === "light") {
    document.body.classList.add("light");
}

updateThemeButton();


/* =========================
   SEND / STOP BUTTON
========================= */

function showGenerating() {

    isGenerating = true;

    document.getElementById("sendButton").style.display =
        "none";

    document.getElementById("stopButton").style.display =
        "block";
}


function showSend() {

    isGenerating = false;

    document.getElementById("sendButton").style.display =
        "block";

    document.getElementById("stopButton").style.display =
        "none";
}


/* =========================
   NEW CHAT
========================= */

function newChat() {

    if (controller) {
        controller.abort();
        controller = null;
    }

    conversation = [];

    showSend();

    document.getElementById("chatInner").innerHTML = `

        <section class="welcome" id="welcome">

            <div class="welcome-logo">
                12
            </div>

            <h1>What can I help with?</h1>

            <p>
                Ask anything. Build anything. Explore anything.
            </p>

        </section>

    `;

    document.getElementById("messageInput").value = "";

    document.getElementById("messageInput").focus();
}


/* =========================
   USER MESSAGE
========================= */

function addUserMessage(text) {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const message =
        document.createElement("div");

    message.className = "message user";

    message.innerHTML = `
        <div class="avatar">U</div>
        <div class="message-content"></div>
    `;

    message.querySelector(".message-content").textContent =
        text;

    document.getElementById("chatInner").appendChild(message);

    scrollBottom();
}


/* =========================
   AI MESSAGE
========================= */

function createAIMessage() {

    const message =
        document.createElement("div");

    message.className = "message ai";

    message.innerHTML = `
        <div class="avatar">12</div>

        <div class="message-content">
            <div class="thinking">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    `;

    document.getElementById("chatInner").appendChild(message);

    scrollBottom();

    return message.querySelector(".message-content");
}


/* =========================
   STOP GENERATING
========================= */

function stopGenerating() {

    if (controller) {
        controller.abort();
    }
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    if (isGenerating) {
        return;
    }

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    input.value = "";

    addUserMessage(text);

    conversation.push({
        role: "user",
        content: text
    });

    const aiContent =
        createAIMessage();

    showGenerating();

    controller = new AbortController();

    try {

        const response =
            await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    messages: conversation,

                    temperature: 0.7,

                    max_tokens: 1024,

                    stream: false

                }),

                signal: controller.signal
            });


        if (!response.ok) {
            throw new Error(
                "Server returned " + response.status
            );
        }


        const data =
            await response.json();


        const answer =
            data?.choices?.[0]?.message?.content;


        if (!answer) {
            throw new Error(
                "No response from AI"
            );
        }


        aiContent.innerHTML =
            formatResponse(answer);


        conversation.push({
            role: "assistant",
            content: answer
        });


    } catch (error) {

        if (error.name === "AbortError") {

            aiContent.innerHTML =
                "Generation stopped.";

        } else {

            aiContent.innerHTML =
                `<span style="color:#ef4444">
                    ⚠️ Server is down. Please try again later.
                </span>`;

            console.error(error);
        }

    } finally {

        controller = null;

        showSend();

        scrollBottom();
    }
}


/* =========================
   FORMAT RESPONSE
========================= */

function formatResponse(text) {

    return escapeHTML(text)
        .replace(/\n/g, "<br>");
}


function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================
   SCROLL
========================= */

function scrollBottom() {

    const chat =
        document.getElementById("chat");

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   ENTER KEY
========================= */

function handleKey(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();
    }
}

</script>

</body>
  </html>
