<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>12n0name AI</title>

<style>

/* ================= THEME ================= */

:root {
    --bg: #0b0d10;
    --sidebar: #111318;
    --surface: #171a20;
    --hover: #22262e;
    --border: #2a2e36;
    --text: #f2f4f7;
    --muted: #9aa0aa;
    --accent: #00e5ff;
    --accent2: #8b5cf6;
    --danger: #ff4d67;
}

.light {
    --bg: #f5f7fa;
    --sidebar: #ffffff;
    --surface: #ffffff;
    --hover: #eef1f5;
    --border: #d9dde5;
    --text: #17191d;
    --muted: #6b7280;
}

/* ================= RESET ================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* ================= APP ================= */

.app {
    width: 100%;
    height: 100vh;
    display: flex;
}

/* ================= SIDEBAR ================= */

.sidebar {
    width: 270px;
    height: 100vh;
    background: var(--sidebar);
    border-right: 1px solid var(--border);

    position: fixed;
    left: 0;
    top: 0;
    z-index: 1000;

    padding: 18px;

    transform: translateX(-100%);
    transition: transform 0.25s ease;

    display: flex;
    flex-direction: column;

    overflow-y: auto;
}

.sidebar.open {
    transform: translateX(0);
}

/* ================= SIDEBAR CLOSE ================= */

.sidebar-close {
    position: absolute;

    top: 12px;
    right: 12px;

    width: 38px;
    height: 38px;

    border: none;
    border-radius: 10px;

    background: transparent;
    color: var(--text);

    font-size: 28px;
    font-weight: 300;
    line-height: 1;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 10;
}

.sidebar-close:hover {
    background: var(--hover);
}

/* ================= LOGO ================= */

.logo {
    height: 48px;

    display: flex;
    align-items: center;
    gap: 10px;

    margin-bottom: 20px;

    padding-right: 45px;
}

.logo-icon {
    width: 38px;
    height: 38px;

    border-radius: 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;
    font-size: 15px;

    color: white;

    background: linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );
}

.logo span {
    font-size: 18px;
    font-weight: 700;
}

/* ================= NEW CHAT ================= */

.new-chat {
    width: 100%;

    padding: 12px;

    border: 1px solid var(--border);
    border-radius: 10px;

    background: var(--surface);
    color: var(--text);

    cursor: pointer;

    font-size: 14px;
}

.new-chat:hover {
    background: var(--hover);
}

/* ================= MAIN ================= */

.main {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
}

/* ================= TOPBAR ================= */

.topbar {
    height: 62px;
    min-height: 62px;

    border-bottom: 1px solid var(--border);

    display: flex;
    align-items: center;

    padding: 0 18px;

    background: var(--bg);
}

.menu-btn {
    width: 40px;
    height: 40px;

    border: none;
    border-radius: 10px;

    background: transparent;
    color: var(--text);

    font-size: 24px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;
}

.menu-btn:hover {
    background: var(--hover);
}

.title {
    margin-left: 8px;

    font-size: 17px;
    font-weight: 700;
}

.status {
    margin-left: 14px;

    font-size: 12px;
    color: #35d07f;

    display: flex;
    align-items: center;
    gap: 5px;
}

.status::before {
    content: "";

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #35d07f;
}

.theme-btn {
    margin-left: auto;

    width: 40px;
    height: 40px;

    border: none;
    border-radius: 10px;

    background: transparent;
    color: var(--text);

    font-size: 19px;

    cursor: pointer;
}

.theme-btn:hover {
    background: var(--hover);
}

/* ================= CHAT ================= */

.chat {
    flex: 1;

    overflow-y: auto;

    padding: 25px 15px 120px;
}

.chat-inner {
    width: 100%;
    max-width: 850px;

    margin: auto;
}

/* ================= WELCOME ================= */

.welcome {
    min-height: calc(100vh - 210px);

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}

.welcome-icon {
    width: 70px;
    height: 70px;

    border-radius: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;
    font-size: 24px;
    font-weight: bold;

    background: linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );

    margin-bottom: 20px;
}

.welcome h1 {
    font-size: 28px;
    margin-bottom: 10px;
}

.welcome p {
    color: var(--muted);
    max-width: 500px;
}

/* ================= MESSAGES ================= */

.message {
    margin-bottom: 25px;
}

.message.user {
    display: flex;
    justify-content: flex-end;
}

.message.ai {
    display: flex;
    justify-content: flex-start;
}

.bubble {
    max-width: 85%;

    padding: 13px 15px;

    border-radius: 15px;

    line-height: 1.55;

    word-wrap: break-word;
    overflow-wrap: anywhere;
}

.user .bubble {
    background: var(--accent);
    color: #001014;

    border-bottom-right-radius: 4px;
}

.ai .bubble {
    background: var(--surface);
    border: 1px solid var(--border);

    border-bottom-left-radius: 4px;
}

/* ================= CODE ================= */

.code-wrapper {
    margin: 12px 0;

    border: 1px solid var(--border);
    border-radius: 10px;

    overflow: hidden;

    background: #0d0f12;
}

.code-header {
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: flex-end;

    padding: 0 8px;

    border-bottom: 1px solid #252932;
}

.copy-btn {
    border: none;
    border-radius: 7px;

    padding: 6px 10px;

    background: #22262e;
    color: #ddd;

    cursor: pointer;

    font-size: 12px;
}

.copy-btn:hover {
    background: #303641;
}

.code-wrapper pre {
    margin: 0;

    padding: 14px;

    overflow-x: auto;

    color: #e7e7e7;

    font-family: Consolas, Monaco, monospace;
    font-size: 13px;

    line-height: 1.5;

    white-space: pre-wrap;
}

/* ================= INPUT ================= */

.input-area {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    padding: 14px;

    background: linear-gradient(
        transparent,
        var(--bg) 25%
    );
}

.input-box {
    width: 100%;
    max-width: 850px;

    margin: auto;

    min-height: 54px;

    display: flex;
    align-items: flex-end;

    gap: 8px;

    padding: 7px;

    background: var(--surface);

    border: 1px solid var(--border);
    border-radius: 14px;
}

#input {
    flex: 1;

    min-width: 0;

    resize: none;

    max-height: 160px;

    padding: 10px;

    border: none;
    outline: none;

    background: transparent;
    color: var(--text);

    font-family: inherit;
    font-size: 15px;
}

#input::placeholder {
    color: var(--muted);
}

.send-btn,
.stop-btn {
    width: 40px;
    height: 40px;

    flex-shrink: 0;

    border: none;
    border-radius: 10px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 18px;
}

.send-btn {
    background: var(--accent);
    color: #001014;
}

.send-btn:hover {
    opacity: 0.85;
}

.stop-btn {
    background: var(--danger);
    color: white;

    display: none;
}

/* ================= MOBILE ================= */

@media (max-width: 700px) {

    .sidebar {
        width: 280px;
        max-width: 85vw;
    }

    .topbar {
        padding: 0 10px;
    }

    .title {
        font-size: 16px;
    }

    .status {
        display: none;
    }

    .chat {
        padding: 20px 10px 115px;
    }

    .bubble {
        max-width: 92%;
    }

    .welcome h1 {
        font-size: 24px;
    }

    .welcome p {
        font-size: 14px;
        padding: 0 15px;
    }

    .input-area {
        padding: 8px;
    }

    .input-box {
        border-radius: 13px;
    }

    #input {
        font-size: 16px;
    }

    .sidebar-close {
        width: 42px;
        height: 42px;

        top: 10px;
        right: 10px;

        font-size: 30px;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar" id="sidebar">

        <button
            class="sidebar-close"
            type="button"
            onclick="closeSidebar()"
            aria-label="Close sidebar">
            ×
        </button>

        <div class="logo">
            <div class="logo-icon">12</div>
            <span>12n0name</span>
        </div>

        <button
            class="new-chat"
            type="button"
            onclick="newChat()">
            ＋ New chat
        </button>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">

        <header class="topbar">

            <button
                class="menu-btn"
                type="button"
                onclick="toggleSidebar()"
                aria-label="Open menu">
                ☰
            </button>

            <div class="title">
                12n0name AI
            </div>

            <div class="status">
                Online
            </div>

            <button
                class="theme-btn"
                type="button"
                onclick="toggleTheme()"
                aria-label="Change theme">
                ◐
            </button>

        </header>


        <!-- ================= CHAT ================= -->

        <section class="chat" id="chat">

            <div class="chat-inner" id="chatInner">

                <div class="welcome" id="welcome">

                    <div class="welcome-icon">
                        12
                    </div>

                    <h1>
                        How can I help you?
                    </h1>

                    <p>
                        Ask anything and 12n0name AI will respond.
                    </p>

                </div>

            </div>

        </section>


        <!-- ================= INPUT ================= -->

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="input"
                    rows="1"
                    placeholder="Message 12n0name AI..."
                    autocomplete="off"></textarea>

                <button
                    class="stop-btn"
                    id="stopBtn"
                    type="button"
                    onclick="stopGeneration()">
                    ■
                </button>

                <button
                    class="send-btn"
                    id="sendBtn"
                    type="button"
                    onclick="sendMessage()">
                    ↑
                </button>

            </div>

        </div>

    </main>

</div>


<script>

/* ================= API ================= */

const API_URL =
    "https://desktop-3fdvn7b.tail77d397.ts.net/v1/chat/completions";


/* ================= STATE ================= */

let conversation = [];

let controller = null;

let generating = false;


/* ================= SIDEBAR ================= */

function toggleSidebar() {

    const sidebar =
        document.getElementById("sidebar");

    if (sidebar) sidebar.classList.toggle("open");
}


function closeSidebar() {

    const sidebar =
        document.getElementById("sidebar");

    if (sidebar) sidebar.classList.remove("open");
}


/* Close sidebar when tapping outside on mobile */

document.addEventListener("click", function(event) {

    const sidebar =
        document.getElementById("sidebar");

    const menu =
        document.querySelector(".menu-btn");

    if (
        sidebar && menu &&
        window.innerWidth <= 700 &&
        sidebar.classList.contains("open") &&
        !sidebar.contains(event.target) &&
        !menu.contains(event.target)
    ) {

        closeSidebar();
    }

});


/* ================= THEME ================= */

function toggleTheme() {

    document.body.classList.toggle("light");

}


/* ================= NEW CHAT ================= */

function newChat() {

    conversation = [];

    const chatInner =
        document.getElementById("chatInner");

    if (chatInner) {
        chatInner.innerHTML = `

            <div class="welcome" id="welcome">

                <div class="welcome-icon">
                    12
                </div>

                <h1>
                    How can I help you?
                </h1>

                <p>
                    Ask anything and 12n0name AI will respond.
                </p>

            </div>
        `;
    }

    closeSidebar();

}


/* ================= ESCAPE HTML ================= */

function escapeHTML(text) {

    return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ================= CODE BLOCK ================= */

function createCodeBlockHTML(code) {

    const safeCode =
        escapeHTML(code);

    return `

        <div class="code-wrapper">

            <div class="code-header">

                <button
                    class="copy-btn"
                    type="button"
                    onclick="copyCode(this)">
                    Copy
                </button>

            </div>

            <pre>${safeCode}</pre>

        </div>

    `;
}


/* ================= FORMAT INLINE STYLES ================= */

function applyInlineStyles(str) {
    return str
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.*?)\*/g, "<em>$1</em>");
}


/* ================= FORMAT RESPONSE ================= */

function formatResponse(text) {

    text = String(text || "");

    text =
        text.replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n");

    const lines =
        text.split("\n");

    let html = "";

    let inCode = false;

    let codeBuffer = [];

    function flushCode() {

        if (codeBuffer.length > 0) {

            html +=
                createCodeBlockHTML(
                    codeBuffer.join("\n")
                );

            codeBuffer = [];
        }
    }

    for (let line of lines) {

        const trimmed =
            line.trim();

        /* CODE FENCE */

        if (trimmed.startsWith("```")) {

            if (!inCode) {

                inCode = true;

                codeBuffer = [];

            } else {

                inCode = false;

                flushCode();
            }

            continue;
        }


        /* INSIDE CODE */

        if (inCode) {

            codeBuffer.push(line);

            continue;
        }


        /* REMOVE STRAY CODE FENCES */

        line =
            line.replace(/```+/g, "");


        /* EMPTY LINE */

        if (line.trim() === "") {

            html += "<br>";

            continue;
        }


        /* HEADINGS */

        if (/^###\s+/.test(line)) {

            html +=
                "<h3>" +
                escapeHTML(
                    line.replace(/^###\s+/, "")
                ) +
                "</h3>";

            continue;
        }

        if (/^##\s+/.test(line)) {

            html +=
                "<h2>" +
                escapeHTML(
                    line.replace(/^##\s+/, "")
                ) +
                "</h2>";

            continue;
        }

        if (/^#\s+/.test(line)) {

            html +=
                "<h1>" +
                escapeHTML(
                    line.replace(/^#\s+/, "")
                ) +
                "</h1>";

            continue;
        }


        /* BULLET POINTS */

        if (/^[\*\-\+]\s+/.test(line)) {

            let safe = escapeHTML(line.replace(/^[\*\-\+]\s+/, ""));

            safe = applyInlineStyles(safe);

            html += "<div style='margin-left: 20px; padding: 2px 0;'>• " + safe + "</div>";

            continue;
        }


        /* NUMBERED LISTS */

        if (/^\d+\.\s+/.test(line)) {

            const match = line.match(/^(\d+\.)\s+(.*)$/);

            if (match) {

                let safe = escapeHTML(match[2]);

                safe = applyInlineStyles(safe);

                html += "<div style='margin-left: 20px; padding: 2px 0;'>" + escapeHTML(match[1]) + " " + safe + "</div>";

                continue;
            }
        }


        /* BLOCKQUOTES */

        if (/^>\s+/.test(line)) {

            let safe = escapeHTML(line.replace(/^>\s+/, ""));

            safe = applyInlineStyles(safe);

            html += "<blockquote style='border-left: 3px solid var(--accent); padding-left: 10px; margin: 6px 0; color: var(--muted);'>" + safe + "</blockquote>";

            continue;
        }


        /* HORIZONTAL RULE */

        if (/^(---|\*\*\*|___)$/.test(line.trim())) {

            html += "<hr style='border: none; border-top: 1px solid var(--border); margin: 12px 0;'>";

            continue;
        }


        /* NORMAL TEXT */

        let safe =
            escapeHTML(line);

        safe =
            applyInlineStyles(safe);


        html +=
            "<div>" +
            safe +
            "</div>";
    }


    /* UNFINISHED CODE BLOCK */

    if (inCode) {

        flushCode();

    }


    /* FINAL SAFETY CLEANUP */

    html =
        html.replace(/```+/g, "");


    return html;
}


/* ================= COPY CODE ================= */

async function copyCode(button) {

    if (!button) return;

    try {

        const wrapper = button.closest(".code-wrapper");

        const code = wrapper ? wrapper.querySelector("pre").innerText : "";

        await navigator.clipboard.writeText(code);

        button.textContent = "Copied!";

        setTimeout(function() {

            if (button) button.textContent = "Copy";

        }, 1500);

    } catch (err) {

        button.textContent = "Failed";

        setTimeout(function() {

            if (button) button.textContent = "Copy";

        }, 1500);
    }
}


/* ================= ADD MESSAGE ================= */

function addMessage(role, text) {

    const chatInner =
        document.getElementById("chatInner");

    if (!chatInner) return null;

    const welcome =
        document.getElementById("welcome");

    if (welcome) {

        welcome.remove();
    }


    const message =
        document.createElement("div");

    message.className =
        "message " + role;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    if (role === "user") {

        bubble.textContent = text;

    } else {

        bubble.innerHTML =
            formatResponse(text);
    }


    message.appendChild(bubble);

    chatInner.appendChild(message);

    scrollBottom();

    return bubble;
}


/* ================= SCROLL ================= */

function scrollBottom() {

    const chat =
        document.getElementById("chat");

    if (chat) {
        chat.scrollTop =
            chat.scrollHeight;
    }
}


/* ================= STOP ================= */

function stopGeneration() {

    if (controller) {

        controller.abort();

        controller = null;
    }

    generating = false;

    const stopBtn = document.getElementById("stopBtn");
    const sendBtn = document.getElementById("sendBtn");

    if (stopBtn) stopBtn.style.display = "none";
    if (sendBtn) sendBtn.style.display = "flex";
}


/* ================= SEND ================= */

async function sendMessage() {

    if (generating) {
        return;
    }


    const input =
        document.getElementById("input");

    if (!input) return;

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    input.value = "";

    input.style.height = "auto";


    addMessage("user", text);


    conversation.push({
        role: "user",
        content: text
    });


    generating = true;

    controller =
        new AbortController();


    const sendBtn = document.getElementById("sendBtn");
    const stopBtn = document.getElementById("stopBtn");

    if (sendBtn) sendBtn.style.display = "none";
    if (stopBtn) stopBtn.style.display = "flex";


    const aiBubble =
        addMessage("ai", "Thinking...");


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },

                    body: JSON.stringify({

                        messages: conversation,

                        temperature: 0.7,

                        max_tokens: 16384,

                        stream: false

                    }),

                    signal: controller.signal
                }
            );


        if (!response.ok) {

            throw new Error(
                "Server error"
            );
        }


        const data =
            await response.json();


        let answer =
            data?.choices?.[0]?.message?.content;


        if (!answer) {

            throw new Error(
                "Invalid response"
            );
        }


        if (aiBubble) {
            aiBubble.innerHTML =
                formatResponse(answer);
        }


        conversation.push({

            role: "assistant",

            content: answer

        });


    } catch (error) {

        if (
            error.name === "AbortError"
        ) {

            if (aiBubble) aiBubble.remove();

        } else {

            /*
             * ONLY show this message.
             */

            if (aiBubble) {
                aiBubble.textContent =
                    "⚠️ Server is down.";
            }
        }

    } finally {

        generating = false;

        controller = null;

        if (stopBtn) stopBtn.style.display = "none";

        if (sendBtn) sendBtn.style.display = "flex";

        scrollBottom();
    }

}


/* ================= ENTER KEY ================= */

const inputEl = document.getElementById("input");

if (inputEl) {

    inputEl.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }

        }
    );


/* ================= TEXTAREA AUTO HEIGHT ================= */

    inputEl.addEventListener(
        "input",
        function() {

            this.style.height =
                "auto";

            this.style.height =
                Math.min(
                    this.scrollHeight,
                    160
                ) + "px";

        }
    );
}

</script>

</body>
</html>
