<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>12n0name AI</title>

<style>
:root {
    --bg: #212121;
    --sidebar: #171717;
    --input: #2f2f2f;
    --text: #ececec;
    --muted: #a0a0a0;
    --border: #444;
    --button: #ffffff;
    --button-text: #000000;

    --code-bg: #0d1117;
    --code-header: #161b22;
    --code-text: #e6edf3;
}

body.light {
    --bg: #ffffff;
    --sidebar: #f7f7f7;
    --input: #f0f0f0;
    --text: #222;
    --muted: #666;
    --border: #ddd;
    --button: #222;
    --button-text: #fff;

    --code-bg: #f6f8fa;
    --code-header: #eaeef2;
    --code-text: #24292f;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}

/* SIDEBAR */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 250px;
    height: 100vh;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    padding: 15px;
}

.logo {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 20px;
}

.new-chat {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-size: 15px;
}

.new-chat:hover {
    background: var(--input);
}

.theme-button {
    position: absolute;
    bottom: 20px;
    left: 15px;
    right: 15px;
    padding: 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
}

/* MAIN */

.main {
    margin-left: 250px;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* TOPBAR */

.topbar {
    height: 60px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-weight: bold;
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 30px 15%;
}

.message {
    margin-bottom: 30px;
    line-height: 1.6;
}

.user-message {
    background: var(--input);
    padding: 14px 18px;
    border-radius: 15px;
    max-width: 80%;
    margin-left: auto;
    white-space: pre-wrap;
}

.ai-message {
    max-width: 90%;
}

.welcome {
    text-align: center;
    margin-top: 20vh;
}

.welcome h1 {
    font-size: 30px;
}

.welcome p {
    color: var(--muted);
}

/* MARKDOWN */

.ai-content {
    line-height: 1.7;
    word-wrap: break-word;
}

.ai-content h1,
.ai-content h2,
.ai-content h3 {
    margin-top: 20px;
    margin-bottom: 10px;
}

.ai-content h1 {
    font-size: 28px;
}

.ai-content h2 {
    font-size: 23px;
}

.ai-content h3 {
    font-size: 19px;
}

.ai-content strong {
    font-weight: bold;
}

.ai-content em {
    font-style: italic;
}

.ai-content del {
    text-decoration: line-through;
}

.ai-content blockquote {
    border-left: 4px solid #888;
    padding-left: 15px;
    margin: 12px 0;
    color: var(--muted);
}

.ai-content a {
    color: #4da6ff;
    text-decoration: underline;
}

.ai-content li {
    margin: 5px 0;
}

/* INLINE CODE */

.inline-code {
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 6px;
    font-family: Consolas, monospace;
    font-size: 0.9em;
}

/* CODE BLOCK */

.code-wrapper {
    margin: 18px 0;
    border: 1px solid var(--border);
    border-radius: 9px;
    overflow: hidden;
    background: var(--code-bg);
}

.code-header {
    height: 42px;
    background: var(--code-header);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    border-bottom: 1px solid var(--border);
}

.code-language {
    font-size: 13px;
    color: var(--muted);
    font-family: Arial, sans-serif;
}

.copy-code {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
}

.copy-code:hover {
    background: var(--input);
}

.code-wrapper pre {
    margin: 0;
    padding: 16px;
    overflow-x: auto;
    background: var(--code-bg);
}

.code-wrapper code {
    color: var(--code-text);
    font-family: Consolas, "Courier New", monospace;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre;
}

/* INPUT */

.input-area {
    padding: 15px 15%;
    border-top: 1px solid var(--border);
}

.input-box {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--input);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 10px;
}

textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 16px;
    font-family: Arial, sans-serif;
    min-height: 24px;
    max-height: 180px;
}

textarea::placeholder {
    color: var(--muted);
}

.send-button,
.stop-button {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    background: var(--button);
    color: var(--button-text);
    font-size: 18px;
}

.stop-button {
    display: none;
}

.status {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 8px;
}

/* MOBILE */

@media (max-width: 700px) {

    .sidebar {
        display: none;
    }

    .main {
        margin-left: 0;
    }

    .chat {
        padding: 20px 12px;
    }

    .input-area {
        padding: 10px;
    }

    .user-message,
    .ai-message {
        max-width: 95%;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">
        12n0name AI
    </div>

    <button class="new-chat" onclick="newChat()">
        + New Chat
    </button>

    <button class="theme-button" onclick="toggleTheme()">
        🌙 Toggle Theme
    </button>

</div>


<!-- MAIN -->

<div class="main">

    <div class="topbar">
        12n0name AI
    </div>


    <div class="chat" id="messages">

        <div class="welcome" id="welcome">

            <h1>How can I help you?</h1>

            <p>
                Ask me anything.
            </p>

        </div>

    </div>


    <div class="input-area">

        <div class="input-box">

            <textarea
                id="input"
                placeholder="Message 12n0name AI..."
                rows="1"
                onkeydown="handleKey(event)"
            ></textarea>

            <button
                class="send-button"
                id="sendButton"
                onclick="sendMessage()"
            >
                ↑
            </button>

            <button
                class="stop-button"
                id="stopButton"
                onclick="stopGenerating()"
            >
                ■
            </button>

        </div>

        <div class="status" id="status">
            Local AI
        </div>

    </div>

</div>


<script>

/* ================================
   API
================================ */

const API_URL =
    "https://desktop-3fdvn7b.tail77d397.ts.net/v1/chat/completions";


/* ================================
   VARIABLES
================================ */

let conversation = [];

let controller = null;

let generating = false;


/* ================================
   ESCAPE HTML
================================ */

function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* ================================
   MARKDOWN FORMATTER
================================ */

function formatResponse(text) {

    let safe = escapeHtml(text);

    /*
        IMPORTANT:

        Code blocks are removed and stored
        before Markdown processing.

        This prevents <br> and other formatting
        from breaking Python/HTML/JS/etc.
    */

    const codeBlocks = [];


    /* CODE BLOCKS */

    safe = safe.replace(
        /```([a-zA-Z0-9_+#.-]*)[ \t]*\n([\s\S]*?)```/g,
        function(match, language, code) {

            const lang = language || "code";

            const codeId =
                "code_" +
                Math.random()
                    .toString(36)
                    .substring(2, 10);


            /* Remove only outside blank lines */

            code = code
                .replace(/^\n/, "")
                .replace(/\n$/, "");


            codeBlocks.push(`

                <div class="code-wrapper">

                    <div class="code-header">

                        <span class="code-language">
                            ${lang}
                        </span>

                        <button
                            class="copy-code"
                            type="button"
                            onclick="copyCode('${codeId}')"
                        >
                            Copy
                        </button>

                    </div>

                    <pre><code id="${codeId}">${code}</code></pre>

                </div>

            `);


            return `___CODE_BLOCK_${codeBlocks.length - 1}___`;
        }
    );


    /* INLINE CODE */

    safe = safe.replace(
        /`([^`\n]+)`/g,
        '<span class="inline-code">$1</span>'
    );


    /* HEADINGS */

    safe = safe.replace(
        /^### (.*)$/gm,
        "<h3>$1</h3>"
    );

    safe = safe.replace(
        /^## (.*)$/gm,
        "<h2>$1</h2>"
    );

    safe = safe.replace(
        /^# (.*)$/gm,
        "<h1>$1</h1>"
    );


    /* BOLD */

    safe = safe.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
    );


    /* ITALIC */

    safe = safe.replace(
        /(?<!\*)\*(?!\*)(.*?)\*(?!\*)/g,
        "<em>$1</em>"
    );


    /* STRIKETHROUGH */

    safe = safe.replace(
        /~~(.*?)~~/g,
        "<del>$1</del>"
    );


    /* LINKS */

    safe = safe.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
    );


    /* BLOCKQUOTES */

    safe = safe.replace(
        /^> (.*)$/gm,
        "<blockquote>$1</blockquote>"
    );


    /* UNORDERED LISTS */

    safe = safe.replace(
        /^(?:[-*]) (.*)$/gm,
        "<li>$1</li>"
    );


    /* ORDERED LISTS */

    safe = safe.replace(
        /^\d+\. (.*)$/gm,
        "<li>$1</li>"
    );


    /*
        Convert normal text newlines.

        Code blocks are still protected.
    */

    safe = safe.replace(
        /\n/g,
        "<br>"
    );


    /* RESTORE CODE BLOCKS LAST */

    safe = safe.replace(
        /___CODE_BLOCK_(\d+)___/g,
        function(match, index) {

            return codeBlocks[Number(index)];

        }
    );


    return `
        <div class="ai-content">
            ${safe}
        </div>
    `;
}


/* ================================
   COPY CODE
================================ */

async function copyCode(id) {

    const code =
        document.getElementById(id);

    if (!code) return;


    try {

        await navigator.clipboard.writeText(
            code.textContent
        );


        const button =
            code
                .closest(".code-wrapper")
                .querySelector(".copy-code");


        const oldText =
            button.textContent;


        button.textContent =
            "Copied!";


        setTimeout(() => {

            button.textContent =
                oldText;

        }, 1500);


    } catch (error) {

        console.error(
            "Copy failed:",
            error
        );

    }

}


/* ================================
   SEND MESSAGE
================================ */

async function sendMessage() {

    const input =
        document.getElementById("input");

    const text =
        input.value.trim();


    if (!text || generating)
        return;


    /* Remove welcome */

    const welcome =
        document.getElementById("welcome");

    if (welcome)
        welcome.remove();


    /* User message */

    addMessage(
        text,
        "user"
    );


    conversation.push({

        role: "user",

        content: text

    });


    input.value = "";

    input.style.height = "auto";


    generating = true;

    controller =
        new AbortController();


    document.getElementById(
        "sendButton"
    ).style.display = "none";


    document.getElementById(
        "stopButton"
    ).style.display = "block";


    document.getElementById(
        "status"
    ).textContent =
        "Generating...";


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        messages:
                            conversation,

                        temperature:
                            0.7,

                        max_tokens:
                            1024,

                        stream:
                            false

                    }),

                    signal:
                        controller.signal

                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        const answer =
            data?.choices?.[0]
                ?.message?.content;


        if (!answer) {

            throw new Error(
                "No AI response received."
            );

        }


        addMessage(
            answer,
            "ai"
        );


        conversation.push({

            role: "assistant",

            content: answer

        });


        document.getElementById(
            "status"
        ).textContent =
            "Local AI";


    } catch (error) {

        if (
            error.name ===
            "AbortError"
        ) {

            document.getElementById(
                "status"
            ).textContent =
                "Generation stopped.";

        } else {

            console.error(error);


            addMessage(
                "⚠️ Connection error: " +
                error.message,
                "ai"
            );


            document.getElementById(
                "status"
            ).textContent =
                "Server error";

        }


    } finally {

        generating = false;

        controller = null;


        document.getElementById(
            "sendButton"
        ).style.display = "block";


        document.getElementById(
            "stopButton"
        ).style.display = "none";

    }

}


/* ================================
   ADD MESSAGE
================================ */

function addMessage(
    text,
    type
) {

    const messages =
        document.getElementById(
            "messages"
        );


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message";


    if (type === "user") {

        message.innerHTML = `
            <div class="user-message">
                ${escapeHtml(text)}
            </div>
        `;

    } else {

        message.className =
            "message ai-message";


        message.innerHTML =
            formatResponse(text);

    }


    messages.appendChild(
        message
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* ================================
   STOP
================================ */

function stopGenerating() {

    if (controller) {

        controller.abort();

    }

}


/* ================================
   NEW CHAT
================================ */

function newChat() {

    conversation = [];


    const messages =
        document.getElementById(
            "messages"
        );


    messages.innerHTML = `

        <div class="welcome" id="welcome">

            <h1>
                How can I help you?
            </h1>

            <p>
                Ask me anything.
            </p>

        </div>

    `;


    document.getElementById(
        "status"
    ).textContent =
        "Local AI";

}


/* ================================
   THEME
================================ */

function toggleTheme() {

    document.body.classList.toggle(
        "light"
    );


    localStorage.setItem(
        "theme",
        document.body.classList.contains(
            "light"
        )
            ? "light"
            : "dark"
    );

}


/* ================================
   LOAD THEME
================================ */

if (
    localStorage.getItem(
        "theme"
    ) === "light"
) {

    document.body.classList.add(
        "light"
    );

}


/* ================================
   ENTER KEY
================================ */

function handleKey(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

}


/* ================================
   AUTO RESIZE
================================ */

document
    .getElementById("input")
    .addEventListener(
        "input",
        function() {

            this.style.height =
                "auto";

            this.style.height =
                Math.min(
                    this.scrollHeight,
                    180
                ) + "px";

        }
    );

</script>

</body>
</html>
