<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>12n0name AI</title>

<style>

/* ================= THEME ================= */

:root {
    --bg: #0b0d10;
    --sidebar: #111318;
    --surface: #171a20;
    --hover: #22262e;
    --border: #292d35;
    --text: #ffffff;
    --secondary: #969ca8;
    --muted: #646a75;
    --user: #252a33;
    --cyan: #00e5ff;
    --purple: #7c4dff;
}

body.light {
    --bg: #f7f8fa;
    --sidebar: #ffffff;
    --surface: #ffffff;
    --hover: #eef0f4;
    --border: #dfe2e8;
    --text: #17191d;
    --secondary: #626875;
    --muted: #8b919d;
    --user: #e9ebef;
    --cyan: #009fc0;
    --purple: #6941d9;
}


/* ================= RESET ================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    transition: background .25s, color .25s;
}


/* ================= SIDEBAR ================= */

.sidebar {
    position: fixed;

    left: 0;
    top: 0;
    bottom: 0;

    width: 270px;

    background: var(--sidebar);

    border-right: 1px solid var(--border);

    padding: 18px;

    z-index: 1000;

    display: none;
}

.sidebar.open {
    display: block;
}

.sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
}

.close-sidebar {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--secondary);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s, color .2s;
}

.close-sidebar:hover {
    background: var(--hover);
    color: var(--text);
}


/* ================= LOGO ================= */

.logo {
    display: flex;
    align-items: center;
    gap: 11px;

    font-size: 20px;
    font-weight: 800;
}

.logo-icon {
    width: 44px;
    height: 44px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #071b24,
            #17102e
        );

    border: 1px solid rgba(0,229,255,.75);

    color: white;

    font-size: 17px;
    font-weight: 900;

    letter-spacing: -2px;

    overflow: hidden;

    box-shadow:
        0 0 10px rgba(0,229,255,.5),
        0 0 28px rgba(124,60,255,.25);
}

.logo-icon::before {
    content: "";

    position: absolute;

    inset: 4px;

    border-radius: 10px;

    border: 1px solid rgba(255,255,255,.16);
}

.logo-icon::after {
    content: "";

    position: absolute;

    width: 75px;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00e5ff,
            #9b5cff,
            transparent
        );

    transform: rotate(-45deg);

    animation:
        scan 2.5s linear infinite;
}

@keyframes scan {

    0% {
        transform:
            translateX(-38px)
            rotate(-45deg);
    }

    100% {
        transform:
            translateX(38px)
            rotate(-45deg);
    }

}


/* ================= NEW CHAT ================= */

.new-chat {
    width: 100%;

    padding: 13px;

    border: 1px solid var(--border);

    border-radius: 11px;

    background: var(--surface);

    color: var(--text);

    font-size: 15px;

    cursor: pointer;
}

.new-chat:hover {
    background: var(--hover);
}


/* ================= MAIN ================= */

.main {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
}


/* ================= TOP BAR ================= */

.topbar {
    height: 64px;

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 0 18px;

    border-bottom:
        1px solid var(--border);
}


/* ================= MENU ================= */

.menu-button {
    width: 43px;
    height: 43px;

    border: none;

    border-radius: 10px;

    background: transparent;

    color: var(--text);

    font-size: 23px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;
}

.menu-button:hover {
    background: var(--hover);
}


/* ================= NAME ================= */

.model {
    font-size: 16px;
    font-weight: bold;
}

.model span {
    color: var(--cyan);
}


/* ================= THEME ================= */

.theme-button {
    width: 42px;
    height: 42px;

    margin-left: auto;

    border: none;

    border-radius: 10px;

    background: transparent;

    color: var(--text);

    font-size: 19px;

    cursor: pointer;
}

.theme-button:hover {
    background: var(--hover);
}


/* ================= CHAT ================= */

.chat {
    flex: 1;

    overflow-y: auto;

    padding:
        40px 20px 145px;
}

.messages {
    max-width: 850px;
    margin: auto;
}


/* ================= WELCOME ================= */

.welcome {
    text-align: center;

    margin-top: 15vh;
}

.welcome h1 {
    font-size: 43px;

    margin-bottom: 13px;

    background:
        linear-gradient(
            90deg,
            var(--text),
            var(--cyan),
            var(--purple)
        );

    -webkit-background-clip: text;

    color: transparent;
}

.welcome p {
    color: var(--secondary);
}


/* ================= MESSAGES ================= */

.message {
    display: flex;

    gap: 13px;

    margin: 25px 0;

    animation:
        appear .25s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.message.user {
    justify-content: flex-end;
}

.message.user .bubble {
    background: var(--user);
}

.msg-avatar {
    min-width: 35px;
    height: 35px;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--purple)
        );

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    font-size: 12px;

    font-weight: bold;
}

.bubble {
    max-width: 75%;

    padding: 12px 15px;

    border-radius: 14px;

    line-height: 1.6;

    color: var(--text);
}


/* ================= INPUT ================= */

.input-area {
    position: fixed;

    bottom: 0;

    left: 0;
    right: 0;

    padding:
        18px 20px 20px;

    background:
        linear-gradient(
            transparent,
            var(--bg) 35%
        );
}

.input-box {
    max-width: 850px;

    margin: auto;

    background: var(--surface);

    border:
        1px solid var(--border);

    border-radius: 17px;

    display: flex;

    align-items: flex-end;

    padding: 9px;
}

textarea {
    flex: 1;

    resize: none;

    background: transparent;

    border: none;

    outline: none;

    color: var(--text);

    font-size: 15px;

    padding: 10px;

    font-family: inherit;
}

textarea::placeholder {
    color: var(--muted);
}


/* ================= SEND ================= */

.send {
    width: 43px;
    height: 43px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--purple)
        );

    color: white;

    cursor: pointer;

    font-size: 18px;

    transition: .2s;
}

.send:hover {
    transform: scale(1.06);
}


/* ================= FOOTER ================= */

.footer {
    text-align: center;

    color: var(--muted);

    font-size: 11px;

    margin-top: 8px;
}


/* ================= MOBILE ================= */

@media (max-width: 700px) {

    .sidebar {
        width: 280px;
    }

    .welcome h1 {
        font-size: 32px;
    }

    .bubble {
        max-width: 85%;
    }

}

</style>

</head>


<body>


<!-- ================= SIDEBAR ================= -->

<aside
    class="sidebar"
    id="sidebar">

    <div class="sidebar-header">

        <div class="logo">

            <div class="logo-icon">
                12
            </div>

            <span>
                12n0name
            </span>

        </div>

        <button
            class="close-sidebar"
            type="button"
            title="Close sidebar"
            onclick="toggleSidebar()">
            ✕
        </button>

    </div>


    <button
        class="new-chat"
        onclick="newChat()">

        ＋ New chat

    </button>

</aside>


<!-- ================= MAIN ================= -->

<main class="main">


    <!-- TOP BAR -->

    <header class="topbar">

        <button
            class="menu-button"
            type="button"
            onclick="toggleSidebar()">

            ☰

        </button>


        <div class="model">

            12n0name
            <span>AI</span>

        </div>


        <button
            class="theme-button"
            id="themeButton"
            type="button"
            onclick="toggleTheme()">

            🌙

        </button>

    </header>


    <!-- ================= CHAT ================= -->

    <section
        class="chat"
        id="chat">

        <div
            class="messages"
            id="messages">

            <div
                class="welcome"
                id="welcome">

                <h1>
                    What can I help with?
                </h1>

                <p>
                    Ask anything. Build anything.
                    Explore anything.
                </p>

            </div>

        </div>

    </section>


    <!-- ================= MESSAGE BOX ================= -->

    <div class="input-area">

        <div class="input-box">

            <textarea
                id="input"
                rows="1"
                placeholder="Ask 12n0name..."></textarea>


            <button
                class="send"
                id="sendButton"
                type="button"
                onclick="sendMessage()">

                ➤

            </button>

        </div>


        <div class="footer">

            12n0name AI can make mistakes.
            Check important information.

        </div>

    </div>

</main>


<script>

/* ================= LLAMA.CPP SERVER ================= */

const API_URL =
    "https://disposal-specialized-drove-gem.trycloudflare.com/v1/chat/completions";


let conversation = [];

let controller = null;

let generating = false;


/* ================= SIDEBAR ================= */

function toggleSidebar() {

    const sidebar =
        document.getElementById("sidebar");

    sidebar.classList.toggle("open");

}


/* ================= THEME ================= */

function toggleTheme() {

    document.body.classList.toggle("light");

    const isLight =
        document.body.classList.contains("light");

    const themeButton =
        document.getElementById("themeButton");

    if (isLight) {

        themeButton.textContent = "☀️";

        localStorage.setItem(
            "theme",
            "light"
        );

    } else {

        themeButton.textContent = "🌙";

        localStorage.setItem(
            "theme",
            "dark"
        );

    }

}


/* ================= LOAD THEME ================= */

if (
    localStorage.getItem("theme")
    === "light"
) {

    document.body.classList.add("light");

    document.getElementById(
        "themeButton"
    ).textContent = "☀️";

}


/* ================= INPUT ================= */

const input =
    document.getElementById("input");

const messages =
    document.getElementById("messages");


input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ================= SEND MESSAGE ================= */

async function sendMessage() {

    if (generating)
        return;


    const text =
        input.value.trim();

    if (!text)
        return;


    const welcome =
        document.getElementById("welcome");

    if (welcome)
        welcome.remove();


    addMessage(
        text,
        "user"
    );


    input.value = "";


    conversation.push({

        role: "user",

        content: text

    });


    const aiMessage =
        createAIMessage();


    generating = true;

    controller =
        new AbortController();


    updateSendButton();


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            messages:
                                conversation,

                            temperature:
                                0.7,

                            max_tokens:
                                1024,

                            stream:
                                false

                        }),

                    signal:
                        controller.signal

                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        const answer =
            data?.choices?.[0]?.message?.content;


        if (!answer) {

            throw new Error(
                "No AI response"
            );

        }


        aiMessage.innerHTML =
            formatResponse(answer);


        conversation.push({

            role: "assistant",

            content: answer

        });


    }

    catch (error) {

        if (
            error.name ===
            "AbortError"
        ) {

            aiMessage.textContent =
                "Generation stopped.";

        } else {

            aiMessage.innerHTML =
                `<span style="color:#ef4444;">
                    ⚠️ Server is down.<br><br>
                    Please try again later.
                </span>`;

            console.error(
                "12n0name AI error:",
                error
            );

        }

    }

    finally {

        generating = false;

        controller = null;

        updateSendButton();

        scrollBottom();

    }

}


/* ================= CREATE AI MESSAGE ================= */

function createAIMessage() {

    const message =
        document.createElement("div");

    message.className =
        "message ai";


    message.innerHTML = `

        <div class="msg-avatar">
            12
        </div>

        <div class="bubble">

            <span class="thinking">
                Thinking...
            </span>

        </div>

    `;


    messages.appendChild(message);

    scrollBottom();


    return message.querySelector(
        ".bubble"
    );

}


/* ================= SEND BUTTON ================= */

function updateSendButton() {

    const button =
        document.getElementById(
            "sendButton"
        );


    if (generating) {

        button.textContent = "■";

        button.title =
            "Stop generating";

        button.style.background =
            "#ef4444";

        button.onclick =
            stopGenerating;

    } else {

        button.textContent = "➤";

        button.title =
            "Send";

        button.style.background =
            "";

        button.onclick =
            sendMessage;

    }

}


/* ================= STOP ================= */

function stopGenerating() {

    if (controller) {

        controller.abort();

    }

}


/* ================= ADD MESSAGE ================= */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    if (type === "ai") {

        message.innerHTML = `

            <div class="msg-avatar">
                12
            </div>

            <div class="bubble">
                ${formatResponse(text)}
            </div>

        `;

    } else {

        message.innerHTML = `

            <div class="bubble">
                ${escapeHTML(text)}
            </div>

        `;

    }


    messages.appendChild(message);

    scrollBottom();

}


/* ================= FORMAT RESPONSE ================= */

function formatResponse(text) {

    return escapeHTML(text)
        .replace(/\n/g, "<br>");

}


/* ================= SCROLL ================= */

function scrollBottom() {

    const chat =
        document.getElementById("chat");

    chat.scrollTo({

        top:
            chat.scrollHeight,

        behavior:
            "smooth"

    });

}


/* ================= NEW CHAT ================= */

function newChat() {

    if (controller) {

        controller.abort();

    }


    conversation = [];

    generating = false;

    controller = null;


    updateSendButton();


    messages.innerHTML = `

        <div
            class="welcome"
            id="welcome">

            <h1>
                What can I help with?
            </h1>

            <p>
                Ask anything. Build anything.
                Explore anything.
            </p>

        </div>

    `;


    input.value = "";

    input.focus();

}


/* ================= ESCAPE ================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}

</script>

</body>
    </html>
